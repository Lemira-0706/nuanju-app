<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>暖居收纳</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ===== 全局变量与主题 ===== */
:root{
  --primary:#F6C6D8; --bg:#FFF5F8; --card:#FFFFFF; --text:#4A3B47;
  --sub:#9E8B94; --border:#F0E3E8; --shadow:0 2px 12px rgba(246,198,216,0.18);
  --radius:16px; --nav-h:56px;
  --gradient:linear-gradient(135deg,#F6C6D8,#FADADD);
}
.dark{
  --primary:#3A2C36; --bg:#1E1A1D; --card:#2A2428; --text:#E8DDE2;
  --sub:#9E8B94; --border:#3A2C36;
  --shadow:0 2px 12px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;}
button{cursor:pointer;border:none;outline:none;background:none;}

/* ===== 顶部栏 ===== */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
.top-left,.top-right{display:flex;align-items:center;gap:8px;}
.top-center{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:18px;font-weight:600;letter-spacing:1px;
}
.top-center img{width:30px;height:30px;border-radius:50%;object-fit:cover;}
.icon-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:20px;transition:background 0.2s;
}
.icon-btn:active{background:var(--border);}

/* ===== 页面容器 ===== */
.page{
  display:none;height:calc(100dvh - var(--nav-h));overflow-y:auto;
  padding:0 0 calc(var(--nav-h) + 8px);scroll-behavior:smooth;
}
.page.active{display:block;}
.no-page-pad{padding-bottom:0;}

/* ===== 底部导航栏 ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  z-index:100;padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--sub);transition:all 0.2s;padding:4px 0;
  opacity:0.65;min-width:48px;
}
.nav-item .nav-icon{font-size:22px;transition:transform 0.2s;}
.nav-item.active{opacity:1;color:var(--primary);}
.nav-item.active .nav-icon{transform:scale(1.15);}
.nav-item .badge{
  position:absolute;top:-2px;right:-8px;background:#FF4757;color:#fff;
  font-size:10px;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.nav-plus{
  width:44px;height:44px;border-radius:50%;
  background:var(--gradient);color:#fff;font-size:28px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(246,198,216,0.4);margin-top:-8px;
}

/* ===== 首页统计卡片 ===== */
.stats-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px;
}
.stat-card{
  background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;
  box-shadow:var(--shadow);
}
.stat-card .num{font-size:22px;font-weight:700;color:var(--primary);}
.stat-card .label{font-size:12px;color:var(--sub);margin-top:2px;}

/* ===== 搜索框 ===== */
.search-box{
  display:flex;align-items:center;margin:2px 16px 10px;
  background:var(--card);border-radius:20px;padding:0 14px;
  border:1px solid var(--border);height:38px;
}
.search-box input{
  flex:1;border:none;outline:none;background:transparent;padding:8px 0;font-size:14px;color:var(--text);
}
.search-box .search-icon{font-size:16px;color:var(--sub);}

/* ===== 我的小家 ===== */
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 16px 8px;font-size:15px;font-weight:600;
}
.room-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 60px;
}
.room-card{
  background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform 0.15s;
}
.room-card:active{transform:scale(0.97);}
.room-card .room-emoji{font-size:28px;}
.room-card .room-name{font-size:14px;font-weight:500;margin-top:4px;}
.furniture-scroll{
  display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-top:4px;
}
.furniture-chip{
  white-space:nowrap;padding:4px 12px;border-radius:20px;
  background:var(--bg);font-size:12px;cursor:pointer;
}

/* ===== 物品卡片 ===== */
.items-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 16px 70px;
}
.item-card{
  background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:transform 0.15s;position:relative;
}
.item-card:active{transform:scale(0.96);}
.item-card .expiry-badge{
  position:absolute;top:6px;left:6px;background:#FF4757;color:#fff;
  font-size:10px;padding:2px 8px;border-radius:10px;z-index:2;
}
.item-card .card-img{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:40px;color:var(--sub);
}
.item-card .card-info{padding:8px 10px 10px;}
.item-card .card-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-card .card-detail{font-size:11px;color:var(--sub);margin-top:2px;}

/* ===== 录入页 ===== */
.entry-form{padding:0 16px 120px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:500;margin-bottom:4px;display:block;}
.form-input,.form-select{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:14px;outline:none;
}
.form-input:focus{border-color:var(--primary);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.photo-upload-area{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;
}
.photo-item{
  width:70px;height:70px;border-radius:10px;overflow:hidden;position:relative;
  border:2px solid transparent;cursor:pointer;
}
.photo-item.cover{border-color:var(--primary);}
.photo-item img{width:100%;height:100%;object-fit:cover;}
.photo-item .cover-badge{
  position:absolute;bottom:0;left:0;right:0;background:var(--primary);color:#fff;
  text-align:center;font-size:9px;padding:1px 0;
}
.photo-item .photo-del{
  position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,0.5);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;
}
.photo-add{
  width:70px;height:70px;border-radius:10px;border:2px dashed var(--border);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--sub);cursor:pointer;
}
.entry-form-actions{
  position:sticky;bottom:0;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--border);margin-top:12px;
}
.entry-form-actions button{
  flex:1;padding:12px 8px;border-radius:10px;font-size:14px;font-weight:500;transition:opacity 0.2s;
}
.btn-cancel{background:var(--border);color:var(--text);}
.btn-save{background:var(--gradient);color:#fff;}
.btn-save-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}

/* ===== 筛选栏 ===== */
.filter-bar{
  display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;flex-wrap:nowrap;
}
.filter-chip{
  white-space:nowrap;padding:4px 14px;border-radius:16px;font-size:12px;
  background:var(--border);color:var(--sub);cursor:pointer;transition:all 0.2s;
}
.filter-chip.active{background:var(--primary);color:#fff;}
.sub-filter{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 8px;}

/* ===== AI对话 ===== */
.chat-container{
  height:calc(100dvh - var(--nav-h) - 130px);overflow-y:auto;padding:10px 16px 110px;
}
.chat-msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-avatar{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.chat-bubble{
  max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;
  background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,0.05);
}
.chat-msg.user .chat-bubble{background:var(--primary);color:#fff;}
.chat-bubble img{max-width:100%;border-radius:8px;margin-top:4px;}
.chat-quick{
  display:flex;gap:8px;padding:8px 16px;overflow-x:auto;
}
.chat-quick button{
  white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;
  background:var(--border);color:var(--text);flex-shrink:0;
}
.chat-input-bar{
  position:sticky;bottom:0;display:flex;align-items:center;gap:8px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--border);
}
.chat-input-bar input{
  flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px;outline:none;
}
.chat-input-bar .attach-btn{font-size:22px;color:var(--sub);cursor:pointer;}

/* ===== 通用 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
.action-sheet{
  width:100%;max-width:400px;background:var(--card);border-radius:16px 16px 0 0;
  padding:16px;animation:slideUp 0.2s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}}
.action-sheet button{
  display:block;width:100%;padding:14px;text-align:center;font-size:15px;
  border-bottom:1px solid var(--border);color:var(--text);
}
.action-sheet button:last-child{border:none;color:var(--sub);}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <div class="top-left"><button class="icon-btn" onclick="toggleMenu()">☰</button></div>
  <div class="top-center" onclick="randomTheme()">
    <img src="icon-192.png" alt="小熊">暖居收纳
  </div>
  <div class="top-right"><button class="icon-btn" onclick="showPage('settings')">⚙️</button></div>
</div>

<!-- 页面容器 -->
<div id="page-home" class="page active"></div>
<div id="page-entry" class="page no-page-pad"></div>
<div id="page-reminders" class="page"></div>
<div id="page-ai" class="page no-page-pad"></div>
<div id="page-items" class="page"></div>
<div id="page-menu" class="page"></div>
<div id="page-room" class="page"></div>
<div id="page-furniture" class="page"></div>
<div id="page-stats" class="page"></div>
<div id="page-rooms-manage" class="page"></div>
<div id="page-tags-manage" class="page"></div>
<div id="page-themes" class="page"></div>
<div id="page-import" class="page"></div>
<div id="page-settings" class="page"></div>

<!-- 底部导航栏 -->
<div class="bottom-nav" id="bottomNav"></div>

<script>
// ===== 数据初始化 =====
const STORAGE_KEY = 'nuanju_data';
const THEME_KEY = 'nuanju_theme';
const REMINDER_KEY = 'nuanju_reminders';
const API_KEY = 'nuanju_api_key';

let state = {
  currentNav: 'home',
  items: [],
  rooms: [
    {id:'r1',emoji:'🛋️',name:'客厅',furnitures:[{id:'f1',emoji:'📺',name:'电视柜'},{id:'f2',emoji:'🪑',name:'茶几'}]},
    {id:'r2',emoji:'🛏️',name:'卧室',furnitures:[{id:'f3',emoji:'👗',name:'衣柜'},{id:'f4',emoji:'📚',name:'床头柜'}]},
    {id:'r3',emoji:'🍳',name:'厨房',furnitures:[{id:'f5',emoji:'🍽️',name:'橱柜'},{id:'f6',emoji:'🧊',name:'冰箱'}]},
    {id:'r4',emoji:'🚿',name:'卫生间',furnitures:[{id:'f7',emoji:'🪥',name:'洗漱台'},{id:'f8',emoji:'🧴',name:'储物柜'}]}
  ],
  categories: [
    {id:'c1',emoji:'📱',name:'数码产品'},
    {id:'c2',emoji:'🛋️',name:'家居用品'},
    {id:'c3',emoji:'💄',name:'美妆护肤'},
    {id:'c4',emoji:'👗',name:'服饰鞋包'},
    {id:'c5',emoji:'💊',name:'药品保健'}
  ],
  tags: ['夏装','冬装','办公','运动','宠物'],
  statuses: [{id:'s1',emoji:'✅',name:'在用'},{id:'s2',emoji:'⏸️',name:'闲置'},{id:'s3',emoji:'💔',name:'破损'},{id:'s4',emoji:'🎁',name:'送人'},{id:'s5',emoji:'💰',name:'卖出'}],
  reminders: [],
  settings: {
    cardShow:{photo:true,room:true,furniture:true,qty:true,buyDate:true,expireDate:true,openDate:true,afterOpenDays:true,avgPrice:true,tags:true,status:true},
    formShow:{photo:true,room:true,furniture:true,qty:true,buyDate:true,expireDate:true,openDate:true,afterOpenDays:true,avgPrice:true,tags:true,status:true}
  }
};

// 录入暂存
let itemPhotos = [];
let coverIndex = 0;
let editingId = null;

// ===== 存储 =====
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function loadState(){
  const d=localStorage.getItem(STORAGE_KEY);
  if(d){try{const p=JSON.parse(d);Object.assign(state,p);}catch(e){}}
  state.reminders=JSON.parse(localStorage.getItem(REMINDER_KEY)||'[]');
}
loadState();

// ===== 主题 =====
const themes=[
  {name:'治愈樱粉',primary:'#F6C6D8',bg:'#FFF5F8'},
  {name:'明悦鹅黄',primary:'#F5E6B8',bg:'#FFFCF0'},
  {name:'恬静天蓝',primary:'#B8D4F0',bg:'#F0F8FF'},
  {name:'清雅淡绿',primary:'#B8E0C8',bg:'#F0FFF5'},
  {name:'朝暮浅紫',primary:'#D4C0F0',bg:'#F8F0FF'},
  {name:'暗夜幽黑',primary:'#3A2C36',bg:'#1E1A1D'}
];
let themeIdx=parseInt(localStorage.getItem(THEME_KEY))||0;
applyTheme(themeIdx);
function applyTheme(idx){
  const t=themes[idx];if(!t)return;
  document.documentElement.style.setProperty('--primary',t.primary);
  document.documentElement.style.setProperty('--bg',t.bg);
  if(idx===5)document.body.classList.add('dark');else document.body.classList.remove('dark');
  localStorage.setItem(THEME_KEY,idx);
}
function randomTheme(){
  let n;do{n=Math.floor(Math.random()*themes.length);}while(n===themeIdx);
  themeIdx=n;applyTheme(n);
}

// ===== 导航 =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById('page-'+id);
  if(el)el.classList.add('active');
  state.currentNav=id;
  renderBottomNav();
  if(id==='home')renderHome();
  else if(id==='items')renderItems();
  else if(id==='reminders')renderReminders();
  else if(id==='ai')renderChat();
  else if(id==='stats')renderStats();
  else if(id==='rooms-manage')renderRoomsManage();
  else if(id==='tags-manage')renderTagsManage();
  else if(id==='themes')renderThemes();
  else if(id==='import')renderImport();
  else if(id==='settings')renderSettings();
}
function toggleMenu(){showPage('menu');renderMenu();}

function renderBottomNav(){
  const nav=document.getElementById('bottomNav');
  const cur=state.currentNav;
  const badge=state.reminders.filter(r=>!r.read).length;
  nav.innerHTML=`
    <div class="nav-item ${cur==='home'?'active':''}" onclick="showPage('home')">
      <span class="nav-icon">🏠</span><span>首页</span>
    </div>
    <div class="nav-item ${cur==='reminders'?'active':''}" style="position:relative" onclick="showPage('reminders')">
      <span class="nav-icon">🔔${badge>0?`<span class="badge">${badge}</span>`:''}</span><span>提醒</span>
    </div>
    <div class="nav-plus" onclick="showEntryForm(null)">＋</div>
    <div class="nav-item ${cur==='ai'?'active':''}" onclick="showPage('ai')">
      <span class="nav-icon">🐻</span><span>AI小兜</span>
    </div>
    <div class="nav-item ${cur==='items'?'active':''}" onclick="showPage('items')">
      <span class="nav-icon">📋</span><span>清单</span>
    </div>
  `;
}

// ===== 首页 =====
function renderHome(){
  const page=document.getElementById('page-home');
  const total=state.items.length;
  const totalValue=state.items.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const avgPrice=total>0?(totalValue/total).toFixed(0):0;
  page.innerHTML=`
    <div class="stats-row">
      <div class="stat-card"><div class="num">${total}</div><div class="label">总数量</div></div>
      <div class="stat-card"><div class="num">¥${totalValue.toFixed(0)}</div><div class="label">物品总值</div></div>
      <div class="stat-card"><div class="num">¥${avgPrice}</div><div class="label">日均价</div></div>
    </div>
    <div class="search-box">
      <input placeholder="搜索物品..." onkeydown="if(event.key==='Enter'){searchGlobal(this.value)}">
      <span class="search-icon">🔍</span>
    </div>
    <div class="section-title">我的小家</div>
    <div class="room-grid">
      ${state.rooms.map(r=>`
        <div class="room-card" onclick="showRoom('${r.id}')">
          <div class="room-emoji">${r.emoji}</div>
          <div class="room-name">${r.name}</div>
          <div class="furniture-scroll">
            ${r.furnitures.map(f=>`<span class="furniture-chip" onclick="event.stopPropagation();showFurniture('${r.id}','${f.id}')">${f.emoji}${f.name}</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function searchGlobal(keyword){
  state.currentSearch=keyword;
  showPage('items');
}
function showRoom(rid){
  const r=state.rooms.find(x=>x.id===rid);
  if(!r)return;
  const page=document.getElementById('page-room');
  page.innerHTML=`
    <div style="padding:10px 16px;display:flex;align-items:center;gap:8px;">
      <button class="icon-btn" onclick="showPage('home')">←</button>
      <span style="font-size:18px;font-weight:600;">${r.emoji} ${r.name}</span>
    </div>
    <div class="section-title">家具</div>
    <div style="padding:0 16px;display:flex;flex-wrap:wrap;gap:10px;">
      ${r.furnitures.map(f=>`
        <div style="background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:80px;text-align:center;" onclick="showFurniture('${r.id}','${f.id}')">
          <div style="font-size:28px;">${f.emoji}</div>
          <div style="font-size:13px;margin-top:4px;">${f.name}</div>
        </div>
      `).join('')}
    </div>
  `;
  showPage('room');
}
function showFurniture(rid,fid){
  const items=state.items.filter(i=>i.roomId===rid&&i.furnitureId===fid);
  const page=document.getElementById('page-furniture');
  page.innerHTML=`
    <div style="padding:10px 16px;display:flex;align-items:center;gap:8px;">
      <button class="icon-btn" onclick="showPage('room')">←</button>
      <span style="font-size:18px;font-weight:600;">家具物品</span>
    </div>
    <div class="items-grid">
      ${items.length?items.map(itemCardHtml).join(''):'<div style="padding:40px;text-align:center;color:var(--sub);">暂无物品</div>'}
    </div>
  `;
  showPage('furniture');
}
function itemCardHtml(item){
  const daysLeft=item.expireDate?Math.ceil((new Date(item.expireDate)-new Date())/86400000):null;
  const cover=item.photos&&item.photos.length>0?item.photos[item.coverIndex||0].src:null;
  return `
    <div class="item-card" onclick="viewItem('${item.id}')" oncontextmenu="event.preventDefault();editItem('${item.id}')">
      ${daysLeft!==null?`<span class="expiry-badge">${daysLeft<=0?'已过期':daysLeft+'天后到期'}</span>`:''}

function renderPhotoUpload(){
  const box=document.getElementById('photoBox');
  if(!box)return;
  box.innerHTML='';
  itemPhotos.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='photo-item'+(i===coverIndex?' cover':'');
    div.innerHTML=`<img src="${p.src}" alt=""><span class="cover-badge">封面</span><button class="photo-del" data-i="${i}">✕</button>`;
    div.onclick=(e)=>{
      if(e.target.classList.contains('photo-del'))return;
      coverIndex=i;
      renderPhotoUpload();
    };
    div.querySelector('.photo-del').onclick=(e)=>{
      e.stopPropagation();
      itemPhotos.splice(i,1);
      if(coverIndex>=itemPhotos.length)coverIndex=0;
      renderPhotoUpload();
    };
    box.appendChild(div);
  });
  const addBtn=document.createElement('div');
  addBtn.className='photo-add';addBtn.textContent='＋';
  addBtn.onclick=()=>{
    showActionSheet([
      {label:'📷 拍照',action:()=>addPhoto('camera')},
      {label:'🖼️ 从相册选择',action:()=>addPhoto('album')},
      {label:'取消',cancel:true}
    ]);
  };
  box.appendChild(addBtn);
}
async function addPhoto(type){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';
  if(type==='camera')input.capture='environment';
  else input.multiple=true;
  input.onchange=async (e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length)return;
    const remain=6-itemPhotos.length;
    if(remain<=0){alert('最多上传6张照片');return;}
    const toAdd=files.slice(0,remain);
    const readOne=(file)=>new Promise((res,rej)=>{
      const reader=new FileReader();
      reader.onerror=rej;
      reader.onload=()=>res({src:reader.result,name:file.name});
      reader.readAsDataURL(file);
    });
    try{
      const results=await Promise.all(toAdd.map(readOne));
      itemPhotos.push(...results);
      renderPhotoUpload();
    }catch(err){console.error(err);}
  };
  input.click();
}
function saveItem(continueAdd){
  const name=document.getElementById('ef-name')?.value.trim();
  if(!name){alert('请输入物品名称');return;}
  const price=parseFloat(document.getElementById('ef-price')?.value)||0;
  const qty=parseInt(document.getElementById('ef-qty')?.value)||1;
  const buyDate=document.getElementById('ef-buyDate')?.value||'';
  const expireDate=document.getElementById('ef-expireDate')?.value||'';
  const openDate=document.getElementById('ef-openDate')?.value||'';
  const afterOpenDays=parseInt(document.getElementById('ef-afterOpen')?.value)||0;
  const roomId=document.getElementById('ef-room')?.value||'';
  const furnitureId=document.getElementById('ef-furniture')?.value||'';
  const categoryId=document.getElementById('ef-category')?.value||'';
  const statusId=document.getElementById('ef-status')?.value||'';
  const note=document.getElementById('ef-note')?.value||'';
  const selectedTags=Array.from(document.querySelectorAll('#ef-tags .active')).map(el=>el.dataset.tag);
  const room=state.rooms.find(r=>r.id===roomId);
  const furniture=room?room.furnitures.find(f=>f.id===furnitureId):null;
  const item={
    id:editingId||Date.now().toString(),
    name,price,qty,buyDate,expireDate,openDate,afterOpenDays,
    roomId,furnitureId,categoryId,statusId,note,
    tags:selectedTags,
    photos:itemPhotos,
    coverIndex:coverIndex,
    roomName:room?room.name:'',
    furnitureName:furniture?furniture.name:'',
    createdAt:editingId?undefined:new Date().toISOString()
  };
  if(editingId){
    const idx=state.items.findIndex(i=>i.id===editingId);
    if(idx>-1)state.items[idx]=item;
  }else{
    state.items.push(item);
  }
  generateRemindersForItem(item);
  saveState();
  if(continueAdd){
    itemPhotos=[];coverIndex=0;
    renderEntryForm(null);
  }else{
    showPage('home');
  }
}
