  <!-- 底部小字 -->
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#7a4a55">暖居收纳</text>
