    <circle cx="-118" cy="-118" r="52" fill="#b07a5c"/>
    <circle cx="-118" cy="-118" r="30" fill="#e8b89c"/>
    <circle cx="118" cy="-118" r="52" fill="#b07a5c"/>
    <circle cx="118" cy="-118" r="30" fill="#e8b89c"/>
