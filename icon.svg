    <!-- 腮红 -->
    <ellipse cx="-108" cy="40" rx="26" ry="16" fill="#ff8fab" opacity="0.55"/>
    <ellipse cx="108" cy="40" rx="26" ry="16" fill="#ff8fab" opacity="0.55"/>
