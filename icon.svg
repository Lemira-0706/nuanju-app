    <ellipse cx="0" cy="0" rx="170" ry="150" fill="#d9a87a"/>
    <!-- 眼白 -->
    <ellipse cx="-62" cy="-22" rx="30" ry="36" fill="#ffffff"/>
    <ellipse cx="62" cy="-22" rx="30" ry="36" fill="#ffffff"/>
    <!-- 瞳孔 -->
    <ellipse cx="-62" cy="-14" rx="16" ry="20" fill="#3a2a20"/>
    <ellipse cx="62" cy="-14" rx="16" ry="20" fill="#3a2a20"/>
    <!-- 高光 -->
    <circle cx="-68" cy="-22" r="6" fill="#ffffff"/>
    <circle cx="56" cy="-22" r="6" fill="#ffffff"/>
