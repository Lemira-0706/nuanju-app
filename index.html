<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFB6C1">
<title>暖居收纳</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

<style>
/* ========== 主题变量 ========== */
:root {
  --primary: #FF9BB5;
  --primary-light: #FFD6E0;
  --primary-dark: #E87A9E;
  --bg: #FFF5F7;
  --card-bg: #FFFFFF;
  --text: #333333;
  --text-secondary: #888888;
  --border: #EEE0E5;
  --shadow: rgba(255, 155, 181, 0.15);
  --gradient: linear-gradient(135deg, #FFB6C8 0%, #FFE0E9 100%);
  --nav-bg: rgba(255, 255, 255, 0.95);
}

/* 治愈樱粉 - 默认 */
.theme-sakura {
  --primary: #FF9BB5;
  --primary-light: #FFD6E0;
  --primary-dark: #E87A9E;
  --bg: #FFF5F7;
  --border: #F0D0DA;
  --shadow: rgba(255, 155, 181, 0.15);
  --gradient: linear-gradient(135deg, #FFB6C8 0%, #FFE0E9 100%);
}

/* 明悦鹅黄 */
.theme-yellow {
  --primary: #F5C842;
  --primary-light: #FFF3C4;
  --primary-dark: #E0A800;
  --bg: #FFFAF0;
  --border: #F0E4A0;
  --shadow: rgba(245, 200, 66, 0.15);
  --gradient: linear-gradient(135deg, #FFE082 0%, #FFF8E1 100%);
}

/* 恬静天蓝 */
.theme-blue {
  --primary: #64B5F6;
  --primary-light: #D1E9FF;
  --primary-dark: #42A5F5;
  --bg: #F0F8FF;
  --border: #BED8F0;
  --shadow: rgba(100, 181, 246, 0.15);
  --gradient: linear-gradient(135deg, #90CAF9 0%, #E3F2FD 100%);
}

/* 清雅淡绿 */
.theme-green {
  --primary: #81C784;
  --primary-light: #D5F0D5;
  --primary-dark: #66BB6A;
  --bg: #F0FAF0;
  --border: #C0E0C0;
  --shadow: rgba(129, 199, 132, 0.15);
  --gradient: linear-gradient(135deg, #A5D6A7 0%, #E8F5E9 100%);
}

/* 朝暮浅紫 */
.theme-purple {
  --primary: #CE93D8;
  --primary-light: #EDD2F5;
  --primary-dark: #BA68C8;
  --bg: #FAF0FF;
  --border: #E0C8ED;
  --shadow: rgba(206, 147, 216, 0.15);
  --gradient: linear-gradient(135deg, #CE93D8 0%, #F3E5F5 100%);
}

/* 暗夜幽黑 - 深色模式 */
.theme-dark {
  --primary: #B0BEC5;
  --primary-light: #37474F;
  --primary-dark: #78909C;
  --bg: #121212;
  --card-bg: #1E1E1E;
  --text: #E0E0E0;
  --text-secondary: #999999;
  --border: #333333;
  --shadow: rgba(0, 0, 0, 0.3);
  --gradient: linear-gradient(135deg, #263238 0%, #37474F 100%);
  --nav-bg: rgba(30, 30, 30, 0.95);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; background: #000; overflow: hidden; }
img { max-width: 100%; }

/* ========== 手机容器 ========== */
#app {
  width: 100%; height: 100%;
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  background: #222;
}
.phone {
  width: 100%; max-width: 440px;
  height: 100vh; height: 100dvh; min-height: 100vh; min-height: 100dvh;
  position: relative; overflow: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  display: flex; flex-direction: column;
  /* 关键：为安卓底部手势条预留空间，所有子页面在此区域内布局 */
  padding-bottom: 0;
}

/* 安卓机型安全区兜底（vivo 等刘海/挖孔/底部手势条） */
@supports (padding: max(0px)) {
  .phone { padding-bottom: 0; }
}

/* ========== 顶部栏 ========== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--card-bg);
  z-index: 100; flex-shrink: 0;
}
.top-bar .left, .top-bar .right { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: background 0.2s; }
.top-bar .left:active, .top-bar .right:active { background: var(--primary-light); }
.top-bar .center { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 12px; border-radius: 20px; transition: transform 0.3s; }
.top-bar .center:active { transform: scale(0.92); }
.logo-bear { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--gradient); }
.app-name { font-size: 17px; font-weight: 700; color: var(--text); }

/* ========== 页面容器 ========== */
.pages { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.page {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  /* 底部导航栏高度 56 + 安全区，内容在此之上可滚动；内容页自行在末尾留白 */
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  opacity: 0; transform: translateX(20px); pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  -webkit-overflow-scrolling: touch;
}
.page.active { opacity: 1; transform: translateX(0); pointer-events: all; }
.page::-webkit-scrollbar { display: none; }
/* 需要自身控制滚动的特殊页（聊天页）覆盖 padding，由内部 flex 精确计算 */
.page.no-page-pad { padding-bottom: 0; }
/* 录入/编辑页：底部为 取消/保存/保存+继续 按钮留出底部导航栏高度，按钮 sticky 至此上方 */
#page-entry { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }

/* ========== 首页内容 ========== */
.stats-row { display: flex; gap: 10px; padding: 10px 16px; }
.stat-card {
  flex: 1; background: var(--card-bg); border-radius: 14px; padding: 14px 10px;
  text-align: center; box-shadow: 0 2px 10px var(--shadow);
  border: 1px solid var(--border);
}
.stat-card .value { font-size: 20px; font-weight: 800; color: var(--primary); }
.stat-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

.search-box {
  margin: 2px 16px 10px; background: var(--card-bg); border-radius: 25px;
  padding: 9px 16px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border);
}
.search-box input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: var(--text); }
.search-box input::placeholder { color: var(--text-secondary); }

.section-title { font-size: 16px; font-weight: 700; color: var(--text); padding: 4px 16px 8px; display: flex; align-items: center; gap: 6px; }

/* 房间标签 */
.room-tabs { display: flex; gap: 8px; padding: 0 16px 14px; overflow-x: auto; scrollbar-width: none; }
.room-tabs::-webkit-scrollbar { display: none; }
.room-tab {
  padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600;
  background: var(--card-bg); border: 1.5px solid var(--border); color: var(--text-secondary);
  white-space: nowrap; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.room-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* 家具网格 */
.furniture-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
.furniture-card {
  background: var(--card-bg); border-radius: 16px; padding: 18px 14px;
  text-align: center; box-shadow: 0 2px 10px var(--shadow); cursor: pointer;
  border: 1px solid var(--border); transition: transform 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.furniture-card:active { transform: scale(0.95); }
.furniture-card .icon { font-size: 32px; }
.furniture-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
.furniture-card .count { font-size: 12px; color: var(--text-secondary); }

/* ========== 底部导航 ========== */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; width: 100%;
  height: calc(56px + env(safe-area-inset-bottom));
  flex: 0 0 auto;
  display: flex; align-items: stretch; justify-content: space-around;
  padding: 0 6px; padding-bottom: env(safe-area-inset-bottom);
  background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); z-index: 100; flex-shrink: 0;
  box-sizing: border-box;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; cursor: pointer; position: relative; padding: 4px 2px; flex: 1 1 0; min-width: 0;
  /* 未选中：稍暗淡 */
  opacity: 0.55; filter: saturate(0.75);
  transition: opacity 0.25s, filter 0.25s, transform 0.2s;
}
.nav-item .icon { font-size: 22px; line-height: 1; transition: transform 0.2s; }
.nav-item .label { font-size: 10px; color: var(--text-secondary); white-space: nowrap; line-height: 1.2; }
/* 选中：高亮 */
.nav-item.active { opacity: 1; filter: none; }
.nav-item.active .icon { transform: scale(1.15); }
.nav-item.active .label { color: var(--primary); font-weight: 700; }
/* 触摸反馈 */
.nav-item:active { opacity: 1; transform: scale(0.92); }
.nav-badge { position: absolute; top: 4px; right: calc(50% - 22px); background: #FF4757; color: #fff; font-size: 9px; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 4px; line-height: 1; }
.nav-badge.has-count { right: calc(50% - 24px); }

.fab-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--gradient); display: flex; align-items: center; justify-content: center;
  font-size: 30px; color: #fff; box-shadow: 0 4px 15px var(--shadow);
  cursor: pointer; transition: transform 0.15s; margin-top: -16px; flex-shrink: 0; line-height: 1;
  opacity: 1;
}
.fab-btn:active { transform: scale(0.88); }

/* ========== 侧边菜单 ========== */
.side-menu-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.side-menu-overlay.active { opacity: 1; pointer-events: all; }
.side-menu {
  position: absolute; top: 0; left: 0; width: 78%; height: 100%;
  background: var(--card-bg); z-index: 201; transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.3, 0, 0, 1); overflow-y: auto;
  display: flex; flex-direction: column;
}
.side-menu.open { transform: translateX(0); }
.menu-header { padding: 40px 20px 20px; background: var(--gradient); display: flex; align-items: center; gap: 12px; }
.menu-header .logo-bear { width: 44px; height: 44px; font-size: 26px; }
.menu-header .info h3 { font-size: 18px; color: var(--text); }
.menu-header .info p { font-size: 12px; color: var(--text-secondary); }
.menu-list { padding: 12px 10px; flex: 1; }
.menu-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border-radius: 12px; cursor: pointer; transition: background 0.15s; font-size: 15px; color: var(--text);
}
.menu-item:active { background: var(--primary-light); }
.menu-item .micon { font-size: 22px; width: 28px; text-align: center; }
.menu-item .mtext { flex: 1; font-weight: 500; }
.menu-item .marrow { color: var(--text-secondary); font-size: 14px; }
.menu-divider { height: 1px; background: var(--border); margin: 8px 16px; }

/* ========== 物品清单 ========== */
.filter-bar { padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 6px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap;
  background: var(--card-bg); border: 1px solid var(--border); color: var(--text-secondary);
  cursor: pointer; flex-shrink: 0; transition: all 0.2s;
}
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 20px; }
.items-toolbar { position: sticky; top: 0; z-index: 10; padding: 12px 16px 8px;
  background: linear-gradient(180deg, var(--bg) 70%, transparent); }
.items-toolbar .search-box { margin-bottom: 10px; }
.items-toolbar .filter-bar { padding: 4px 0 6px; flex-wrap: wrap; }
.item-card {
  background: var(--card-bg); border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 8px var(--shadow); cursor: pointer; border: 1px solid var(--border);
  transition: transform 0.15s; position: relative;
}
.item-card:active { transform: scale(0.96); }
.item-card .expire-badge {
  position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700; z-index: 2; color: #fff;
}
.expire-badge.urgent { background: #FF4757; }
.expire-badge.soon { background: #FFA502; }
.item-card .photo { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 42px; background: var(--primary-light); }
.item-card .info { padding: 10px 12px; }
.item-card .name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-card .meta { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
.item-card .meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========== 录入表单 ========== */
.entry-tabs { display: flex; gap: 12px; padding: 14px 16px; }
.entry-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 8px; background: var(--card-bg); border-radius: 14px;
  box-shadow: 0 2px 8px var(--shadow); cursor: pointer; border: 1px solid var(--border);
  transition: transform 0.15s;
}
.entry-tab:active { transform: scale(0.94); }
.entry-tab .eicon { font-size: 28px; }
.entry-tab .etext { font-size: 12px; color: var(--text); font-weight: 500; }

.form-group { padding: 0 16px 12px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; background: var(--card-bg); color: var(--text); outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* 照片上传区 */
.photo-upload { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-thumb {
  width: 68px; height: 68px; border-radius: 10px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: var(--primary-light); cursor: grab; position: relative; overflow: hidden;
  touch-action: none; transition: opacity 0.15s;
}
.photo-thumb img { pointer-events: none; }
.photo-thumb.dragging { opacity: 0.5; cursor: grabbing; }
/* 封面标记 */
.cover-badge {
  position: absolute; left: 0; bottom: 0; width: 100%;
  background: var(--primary); color: #fff; font-size: 9px; font-weight: 700;
  text-align: center; padding: 1px 0; line-height: 1.4;
}
/* 非封面图：显示提示文字 */
.cover-set {
  position: absolute; left: 0; bottom: 0; width: 100%;
  background: rgba(0,0,0,0.45); color: #fff; font-size: 9px; font-weight: 600;
  text-align: center; padding: 1px 0; line-height: 1.4; opacity: 0; transition: opacity 0.15s;
}
.photo-thumb:hover .cover-set, .photo-thumb:active .cover-set { opacity: 1; }
.photo-thumb.is-cover { border-color: var(--primary); box-shadow: 0 0 0 1.5px var(--primary); }
.photo-thumb .remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; z-index: 3; }
.photo-thumb.add { border: 2px dashed var(--primary); color: var(--primary); font-size: 28px; cursor: pointer; }
.photo-hint { font-size: 11px; color: var(--text-secondary); margin: 6px 16px 0; line-height: 1.5; }

/* Chip多选 */
.chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px; border-radius: 16px; font-size: 13px;
  background: var(--card-bg); border: 1.5px solid var(--border); color: var(--text);
  cursor: pointer; transition: all 0.2s;
}
.chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

.form-actions { display: flex; gap: 12px; padding: 16px; position: sticky; bottom: 0; background: var(--bg); }

/* 录入/编辑页底部操作按钮：紧贴底部导航栏之上，不再留有空隙也不会被遮挡 */
.entry-form-actions {
  position: sticky; bottom: 0;
  display: flex; gap: 10px;
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  margin-top: 8px;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
}
.entry-form-actions .btn-cancel,
.entry-form-actions .btn-save { flex: 1; }
.entry-form-actions .btn-save + .btn-save { /* 保存+继续 视觉稍弱 */ }
@media (max-width: 380px) {
  .entry-form-actions { gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .entry-form-actions .btn-cancel,
  .entry-form-actions .btn-save { padding: 10px 4px; font-size: 13px; }
}
.btn-cancel, .btn-save {
  flex: 1; padding: 11px 8px; border-radius: 10px; font-size: 14px; font-weight: 600;
  border: none; cursor: pointer; line-height: 1.2; transition: transform 0.15s;
}
.btn-cancel { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-save { background: var(--gradient); color: #fff; }
.entry-form-actions .btn-save + .btn-save { background: var(--card-bg); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-cancel:active, .btn-save:active { transform: scale(0.96); }

/* ========== AI对话 ========== */
.chat-container { display: flex; flex-direction: column; height: 100%; padding-bottom: 0; min-height: 0; }
#page-ai { padding-bottom: 0; overflow: hidden; }
#page-ai .chat-container { padding-bottom: calc(56px + env(safe-area-inset-bottom)); box-sizing: border-box; }
.chat-input-bar { position: sticky; bottom: 0; }
.chat-messages { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 16px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chat-messages::-webkit-scrollbar { display: none; }
.chat-msg { display: flex; gap: 8px; align-items: flex-start; max-width: 85%; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; line-height: 1; }
.chat-msg.bot .chat-avatar { background: var(--gradient); }
.chat-msg.user .chat-avatar { background: transparent; }
.chat-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; color: var(--text); word-break: break-word; }
.chat-msg.bot .chat-bubble { background: var(--card-bg); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px var(--shadow); }
.chat-msg.user .chat-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }

.chat-msg .chat-bubble img { max-width: 100%; border-radius: 10px; display: block; margin-top: 4px; }
.chat-attach-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
.chat-attach-preview .thumb { position: relative; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.chat-attach-preview .thumb img { width: 100%; height: 100%; object-fit: cover; }
.chat-attach-preview .thumb .rm { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #ff4d4f; color: #fff; font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; }

/* 优化：快捷语改为单行横向滑动，高度降低 */
.chat-quickbar { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 6px 12px; background: var(--card-bg); border-top: 1px solid var(--border); flex-shrink: 0; scrollbar-width: none; }
.chat-quickbar::-webkit-scrollbar { display: none; }
.quick-chip { padding: 5px 10px; border-radius: 14px; background: var(--primary-light); color: var(--primary); font-size: 11px; border: 1px solid var(--primary); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.2s; }
.quick-chip:active { background: var(--primary); color: #fff; }

// ========== 工具函数 ==========
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const getEl = () => document.getElementById('phone');

function showToast(msg) {
  const t = $('.toast') || (() => { const el = document.createElement('div'); el.className = 'toast'; document.getElementById('phone').appendChild(el); return el; })();
  t.textContent = msg; t.classList.add('active');
  setTimeout(() => t.classList.remove('active'), 1800);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr); const now = new Date(); now.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function formatDate(d) {
  if (!d) return '';
  const date = new Date(d);
  return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`;
}

function calcDailyPrice(item) {
  if (!item.price || !item.purchaseDate) return 0;
  const days = daysUntil(new Date().toISOString().slice(0,10)) !== null ? Math.max(1, -daysUntil(item.purchaseDate)) : 1;
  let useDays = 365;
  if (item.openUseDays) useDays = item.openUseDays;
  return (item.price * item.quantity / useDays).toFixed(2);
}

// 生成提醒
function generateReminders() {
  const list = [];
  state.items.forEach(item => {
    if (!item.expireDate) return;
    const days = daysUntil(item.expireDate);
    if (days === null) return;
    if (days < 0) {
      list.push({ itemId: item.id, name: item.name, days, status: 'expired', read: false, photo: item.photos[0] || item.category.split(' ')[0], room: item.room, furniture: item.furniture });
    } else if (days <= 15) {
      list.push({ itemId: item.id, name: item.name, days, status: days <= 7 ? 'urgent' : 'soon', read: false, photo: item.photos[0] || item.category.split(' ')[0], room: item.room, furniture: item.furniture });
    }
  });
  list.sort((a, b) => a.days - b.days);
  state.reminders = list;
  updateBadge();
}

function updateBadge() {
  state.unreadCount = state.reminders.filter(r => !r.read).length;
  const badge = $('.nav-badge');
  if (badge) {
    badge.textContent = state.unreadCount > 99 ? '99+' : state.unreadCount;
    badge.style.display = state.unreadCount > 0 ? 'flex' : 'none';
  }
}

// ========== 主题管理 ==========
const themes = [
  { key: 'theme-sakura', name: '治愈樱粉', gradient: 'linear-gradient(135deg, #FFB6C8, #FFE0E9)' },

  { key: 'theme-dark', name: '暗夜幽黑', gradient: 'linear-gradient(135deg, #263238, #37474F)' },
];

function applyTheme(themeKey) {
  state.currentTheme = themeKey;
  const phone = document.getElementById('phone');
  phone.className = 'phone ' + themeKey;
  localStorage.setItem('theme', themeKey);
}

function randomTheme() {
  const available = themes.filter(t => t.key !== state.currentTheme);

// ---- 物品清单 ----
let subFilter = '';

function renderItems() {
  const page = $('#page-items');
  if (!page.dataset.built) {
    page.innerHTML = `
      <div class="items-toolbar">
        <div class="search-box" style="margin:0;">
          <span>🔍</span>
          <input type="text" id="itemSearchInput" placeholder="搜索名称/房间/家具/分类/标签/状态..." value="${state.searchKeyword || ''}" oninput="filterItems()">
        </div>
        <div class="filter-bar" id="filterBar"></div>
      </div>
      <div class="item-grid" id="itemGrid"></div>
    `;
    page.dataset.built = '1';
  }
  renderFilterBar();
  renderItemGrid();
  const input = document.getElementById('itemSearchInput');
  if (input && input.value !== state.searchKeyword) input.value = state.searchKeyword || '';
}

function renderFilterBar() {
  const filters = [
    { key: 'all', label: '全部' },
    { key: 'room', label: '房间' },
    { key: 'furniture', label: '家具' },
    { key: 'category', label: '分类' },
    { key: 'tag', label: '标签' },
    { key: 'status', label: '状态' },
  ];
  const bar = $('#filterBar');
  if (!bar) return;
  let html = filters.map(f => `<div class="filter-chip ${state.filterType === f.key ? 'active' : ''}" onclick="setFilter('${f.key}')">${f.label}</div>`).join('');

  if (state.filterType !== 'all') {
    let options = [];
    switch(state.filterType) {
      case 'room': options = state.rooms.map(r => r.name); break;
      case 'furniture': options = state.rooms.flatMap(r => r.furniture.map(f => f.name)); break;
      case 'category': options = state.categories; break;
      case 'tag': options = state.tags; break;
      case 'status': options = state.statuses; break;
    }
    html += options.map(o => `<div class="filter-chip ${subFilter === o ? 'selected' : ''}" onclick="setSubFilter('${o}')">${o}</div>`).join('');
  }
  bar.innerHTML = html;
}

function setFilter(type) {
  state.filterType = type;
  subFilter = '';
  renderFilterBar();
  renderItemGrid();
}
function setSubFilter(val) {
  subFilter = subFilter === val ? '' : val;
  renderFilterBar();
  renderItemGrid();
}

function getFilteredItems() {
  let items = [...state.items];
  const kw = (state.searchKeyword || '').toLowerCase();
  if (kw) {
    items = items.filter(i =>
      i.name.toLowerCase().includes(kw) ||
      i.room.toLowerCase().includes(kw) ||
      i.furniture.toLowerCase().includes(kw) ||
      i.category.toLowerCase().includes(kw) ||
      (i.tags || []).some(t => t.toLowerCase().includes(kw)) ||
      i.status.toLowerCase().includes(kw)
    );
  }
  if (state.filterType !== 'all' && subFilter) {
    switch(state.filterType) {
      case 'room': items = items.filter(i => i.room === subFilter); break;
      case 'furniture': items = items.filter(i => i.furniture === subFilter); break;
      case 'category': items = items.filter(i => i.category === subFilter); break;
      case 'tag': items = items.filter(i => (i.tags || []).includes(subFilter)); break;
      case 'status': items = items.filter(i => i.status === subFilter); break;
    }
  }
  return items;
}

function renderItemGrid() {
  const grid = $('#itemGrid');
  if (!grid) return;
  const items = getFilteredItems();
  if (items.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">📭</div><div class="text">暂无物品，点击 + 添加吧</div></div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const days = daysUntil(item.expireDate);
    let badge = '';
    if (days !== null && days <= 30) {
      const cls = days < 0 ? 'urgent' : days <= 7 ? 'urgent' : 'soon';
      badge = `<div class="expire-badge ${cls}">${days < 0 ? '已过期' : days + '天后到期'}</div>`;
    }
    const s = state.settings.cardFields;
    const cover = item.photos[0] ? `<img src="${item.photos[0]}" style="width:100%;height:100%;object-fit:cover;">` : item.category.split(' ')[0];
    return `
    <div class="item-card" onclick="openItemDetail(${item.id})" oncontextmenu="editItem(${item.id});return false;">
      ${badge}
      <div class="photo">${cover}</div>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="meta">
          ${s.room ? `<span>📍 ${item.room.replace(/^[^\s]+\s/, '')}</span>` : ''}
          ${s.furniture ? `<span>🪑 ${item.furniture.replace(/^[^\s]+\s/, '')}</span>` : ''}
          ${s.dailyPrice ? `<span>💰 ¥${item.dailyPrice}/天</span>` : ''}
          ${s.quantity ? `<span>📦 ×${item.quantity}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterItems() {
  const input = document.getElementById('itemSearchInput');
  state.searchKeyword = input ? input.value : '';
  renderItemGrid();
}

// ---- 资产统计 ----
function renderStats() {
  const page = $('#page-stats');
  const totalValue = state.items.reduce((s, i) => s + i.price * i.quantity, 0);
  const totalItems = state.items.reduce((s, i) => s + i.quantity, 0);
  const avgPrice = totalItems > 0 ? (totalValue / totalItems).toFixed(0) : 0;
  const dailyTotal = state.items.reduce((s, i) => s + parseFloat(i.dailyPrice || 0), 0).toFixed(2);

  const catStats = {};
  state.categories.forEach(c => catStats[c] = 0);
  state.items.forEach(i => { catStats[i.category] = (catStats[i.category] || 0) + i.price * i.quantity; });
  const maxCatVal = Math.max(...Object.values(catStats), 1);

  const roomStats = {};
  state.rooms.forEach(r => roomStats[r.name] = 0);
  state.items.forEach(i => { roomStats[i.room] = (roomStats[i.room] || 0) + i.price * i.quantity; });
  const maxRoomVal = Math.max(...Object.values(roomStats), 1);

  page.innerHTML = `
    <div style="padding:16px;">
      <div class="big-stat">
        <div class="val">¥${totalValue.toLocaleString()}</div>
        <div class="lbl">总资产价值</div>
      </div>
      <div class="stats-grid" style="margin-bottom:16px;">
        <div class="stats-mini-card"><div class="v">${totalItems}</div><div class="l">物品总数</div></div>
        <div class="stats-mini-card"><div class="v">¥${avgPrice}</div><div class="l">平均单价</div></div>
        <div class="stats-mini-card"><div class="v">¥${dailyTotal}</div><div class="l">日均成本</div></div>
        <div class="stats-mini-card"><div class="v">${state.rooms.length}</div><div class="l">房间数</div></div>
      </div>

      <div class="stats-chart">
        <h4>📊 分类资产分布</h4>
        ${Object.entries(catStats).filter(([k,v])=>v>0).map(([cat, val]) => `
          <div class="chart-bar-row">
            <div class="chart-bar-label">${cat.split(' ')[1] || cat}</div>
            <div class="chart-bar-track">
              <div class="chart-bar-fill" style="width:${(val/maxCatVal*100)}%"><span>¥${val.toLocaleString()}</span></div>
            </div>
          </div>`).join('') || '<div class="empty-state"><div class="emoji">📊</div><div class="text">暂无数据</div></div>'}
      </div>

      <div class="stats-chart">
        <h4>🏠 房间资产分布</h4>
        ${Object.entries(roomStats).filter(([k,v])=>v>0).map(([room, val]) => `
          <div class="chart-bar-row">
            <div class="chart-bar-label">${room.split(' ')[1] || room}</div>
            <div class="chart-bar-track">
              <div class="chart-bar-fill" style="width:${(val/maxRoomVal*100)}%"><span>¥${val.toLocaleString()}</span></div>
            </div>
          </div>`).join('') || '<div class="empty-state"><div class="emoji">🏠</div><div class="text">暂无数据</div></div>'}
      </div>

      <div class="stats-chart">
        <h4>💡 资产概览</h4>
        <div style="font-size:13px;color:var(--text-secondary);line-height:2;">
          <div>📱 数码产品占比: ${totalValue > 0 ? ((catStats['📱 数码产品'] / totalValue) * 100).toFixed(1) : 0}%</div>
          <div>💄 美妆护肤占比: ${totalValue > 0 ? ((catStats['💄 美妆护肤'] / totalValue) * 100).toFixed(1) : 0}%</div>
          <div>🍜 食品饮料占比: ${totalValue > 0 ? ((catStats['🍜 食品饮料'] / totalValue) * 100).toFixed(1) : 0}%</div>
          <div>🧸 其他占比: ${totalValue > 0 ? (((totalValue - catStats['📱 数码产品'] - catStats['💄 美妆护肤'] - catStats['🍜 食品饮料']) / totalValue) * 100).toFixed(1) : 0}%</div>
        </div>
      </div>
    </div>
  `;
}

// ---- 到期提醒 ----
function renderReminders() {
  const page = $('#page-reminders');
  const expired = state.reminders.filter(r => r.status === 'expired');
  const urgent = state.reminders.filter(r => r.status === 'urgent');
  const soon = state.reminders.filter(r => r.status === 'soon');

  function reminderHTML(list, statusText, statusClass) {
    if (list.length === 0) return '';
    return `<div class="reminder-section">
      <div class="sec-header">${statusText} (${list.length})</div>
      <div class="reminder-list">
        ${list.map(r => `<div class="reminder-item ${r.read ? 'read' : ''}" onclick="markReminderRead(${r.itemId})">
          <div class="rphoto">${r.photo}</div>
          <div class="rinfo">
            <div class="rname">${r.name}</div>
            <div class="rtime">${r.room} · ${r.furniture} ${r.read ? '✓' : ''}</div>
          </div>
          <div class="rstatus ${statusClass}">${r.days < 0 ? '已过期' : (r.days + '天后')}</div>
          <div class="ractions" onclick="event.stopPropagation()">
            <button class="btn-read" title="标记为已读" onclick="markReminderRead(${r.itemId})">${r.read ? '✅' : '✅'}</button>
            <button class="btn-del" title="删除" onclick="deleteReminder(${r.itemId})">🗑️</button>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  page.innerHTML = `
    <div style="padding-top:8px;">
      <div class="reminder-actions">
        <button class="btn btn-read-all" onclick="readAllReminders()">✅ 全部已读</button>
        <button class="btn btn-del-all" onclick="deleteAllReminders()">🗑️ 全部删除</button>
      </div>
      ${reminderHTML(expired, '⛔ 已过期', 'expired')}
      ${reminderHTML(urgent, '🔴 即将过期(7天内)', 'urgent')}
      ${reminderHTML(soon, '🟡 即将过期(15天内)', 'soon')}
      ${state.reminders.length === 0 ? '<div class="empty-state"><div class="emoji">🎉</div><div class="text">太好了，没有即将过期的物品！</div></div>' : ''}
    </div>
  `;
}

function markReminderRead(itemId) {
  const r = state.reminders.find(x => x.itemId === itemId);

  updateBadge();
  renderReminders();
  renderBottomNav();

function deleteReminder(itemId) {
  state.reminders = state.reminders.filter(r => r.itemId !== itemId);
  updateBadge();
  renderReminders();
  renderBottomNav();
}

function readAllReminders() {
  state.reminders.forEach(r => r.read = true);

function downloadTemplate() {
  const headers = ['名称','单价','数量','购买日期','过期日期','开封日期','开封后使用期限(天)','房间','家具','分类','状态','标签(逗号分隔)','备注'];
  const sample = ['示例：精华液','399','1','2026/5/10','2026/9/1','2026/5/15','365','🛏️ 卧室','🧴 梳妆台','💄 美妆护肤','✅ 在用','常用,贵重','这是备注'];
  const csv = '\uFEFF' + [headers.join(','), sample.join(',')].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '暖居收纳_模板.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('模板已下载');
}

function exportExcel() {
  const headers = ['名称','单价','数量','总价','购买日期','过期日期','开封日期','开封后使用期限(天)','房间','家具','分类','状态','标签','备注','日均价'];
  const rows = state.items.map(i => [
    i.name, i.price, i.quantity, i.price * i.quantity, i.purchaseDate, i.expireDate,
    i.openDate, i.openUseDays, i.room, i.furniture, i.category, i.status,
    (i.tags || []).join(','), i.notes, i.dailyPrice
  ]);
  const csv = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `暖居收纳_导出_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
}

function importExcel() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,.xlsx,.xls';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const text = ev.target.result;
        const lines = text.split('\n').slice(1); // skip header
        let imported = 0;
        lines.forEach(line => {
          if (!line.trim()) return;
          const cols = line.split(',');
          if (cols[0] && cols[0] !== '示例：精华液') {
            const newItem = {
              id: Date.now() + imported,
              name: cols[0] || '未命名',
              price: parseFloat(cols[1]) || 0,
              quantity: parseInt(cols[2]) || 1,
              purchaseDate: cols[3] || '',
              expireDate: cols[4] || '',
              openDate: cols[5] || '',
              openUseDays: cols[6] || '',
              room: cols[7] || state.rooms[0]?.name || '',
              furniture: cols[8] || '',
              category: cols[9] || state.categories[0] || '',
              status: cols[10] || '✅ 在用',
              tags: cols[11] ? cols[11].split(';').map(t => t.trim()) : [],
              notes: cols[12] || '',
              photos: [],
              dailyPrice: cols[1] ? (parseFloat(cols[1]) / Math.max(1, parseInt(cols[6]) || 365)).toFixed(2) : 0,
            };
            state.items.push(newItem);
            imported++;
          }
        });
        generateReminders();
        renderImport();
        showToast(`成功导入 ${imported} 条数据`);
      } catch(err) {
        showToast('导入失败：文件格式错误');
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = (input && input.value || '').trim();
  if (!text && pendingImages.length === 0) return;
  if (input) input.value = '';
  autoResizeChatInput();
  updateChatSendBtn();

  // 组装用户消息（文本 + 图片）
  const userImages = pendingImages.slice();
  pendingImages = [];
  renderAttachPreview();
  chatHistory.push({ role: 'user', content: text || (userImages.length ? '📷 这是拍的照片/相册选的图，帮我识别并记录～' : ''), images: userImages });
  renderChatMessages();

  // 快捷语常驻，无需隐藏
  renderChatQuickbar();

  // 本地"思考中"占位
  const loadingIdx = chatHistory.length;
  chatHistory.push({ role: 'bot', content: '🐻 正在思考...' });
  renderChatMessages();

  if (!state.apiKey) {
    setTimeout(() => {
      chatHistory[loadingIdx] = { role: 'bot', content: buildLocalReply(text, userImages) };
      renderChatMessages();
    }, 500);
    return;
  }

  // **关键修改**：检查模型是否支持视觉（多模态）
  const supportsVision = state.aiModel.includes('gpt-4o') || state.aiModel.includes('gpt-4-turbo'); // 或者其他视觉模型
  // 如果当前模型不支持视觉且用户发来了图片，则不发图片请求，只发文字并提示
  let imagesToSend = userImages;
  if (!supportsVision && userImages.length > 0) {
    imagesToSend = []; // 不发送图片
    chatHistory.push({ role: 'bot', content: '🐻 当前模型（DeepSeek）不支持直接识别图片。\n\n💡 建议：在设置中切换为 “GPT-4o” 等支持多模态的模型，并配置对应的 API Key，即可实现“看图加物品”。\n\n或者，你可以先用文字描述一下图片里的物品，我来帮你生成记录~' });
    renderChatMessages();
    return;
  }

  // 构建系统提示（收纳数据概览）
  const totalQty = state.items.reduce((s,i)=>s+i.quantity,0);
  const totalAsset = state.items.reduce((s,i)=>s+i.price*i.quantity,0);
  const expiring = state.reminders.filter(r => r.status !== 'expired').map(r => `${r.name}(${r.days}天)`).join('、') || '无';
  const idleItems = state.items.filter(i => i.status && i.status.includes('闲置')).slice(0,8).map(i=>i.name).join('、') || '无';
  const systemPrompt = `你是"暖居收纳"APP的AI助手"小兜"，一只可爱的小熊。你的任务是：
1. 分析用户的物品收纳数据，给出实用、可执行的收纳建议
2. 用户发送的图片可能是物品/商品/收纳场景，请识别并帮助记录或分析
3. 闲聊陪伴、鼓励用户保持整洁

当前用户数据概览：
- 物品总数：${totalQty}
- 资产总值：¥${Number(totalAsset).toLocaleString()}
- 房间：${state.rooms.map(r=>r.name).join('、')}
- 分类：${state.categories.join('、')}
- 即将过期：${expiring}
- 闲置物品：${idleItems}

当用户发送图片时，请仔细识别图片中的物品，并按照以下JSON格式回复（不要包含额外解释，直接输出JSON）：
{"name":"物品名称","price":数值,"quantity":数值,"category":"分类（从给定分类中选择）"}
如果无法识别，请回复"抱歉，我没能识别出物品信息，请提供更多细节"。

请用中文回复，语气亲切可爱，适当使用emoji。`;

  // 组装多模态消息（文本 + 图片）
  const recent = chatHistory.slice(-12);
  const messages = [{ role: 'system', content: systemPrompt }];
  for (const m of recent) {
    if (m.content === '🐻 正在思考...') continue;
    if (m.role === 'user') {
      const parts = [];
      if (m.content) parts.push({ type: 'text', text: m.content });
      (m.images || []).forEach(src => parts.push({ type: 'image_url', image_url: { url: src } }));
      messages.push({ role: 'user', content: parts.length === 1 && parts[0].type === 'text' ? parts[0].text : parts });
    } else {
      messages.push({ role: 'assistant', content: m.content });
    }
  }

  try {
    const response = await fetch(`${state.apiBase}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.apiKey}`
      },
      body: JSON.stringify({
        model: state.aiModel, // 使用选择的模型
        messages,
        stream: false
      })
    });
    if (!response.ok) throw new Error('API请求失败 ' + response.status);
    const data = await response.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message.content) || '（没有得到回复内容）';
    // 尝试解析JSON物品卡
    const parsed = parseItemFromAI(reply);
    if (parsed) {
      chatHistory[loadingIdx] = { role: 'bot', content: reply, itemCard: parsed };
    } else {
      chatHistory[loadingIdx] = { role: 'bot', content: reply };
    }
  } catch(err) {
    console.error(err);
    chatHistory[loadingIdx] = { role: 'bot', content: buildLocalReply(text, userImages) + '\n\n⚠️ 刚才有道联网请求出错，已切换为本地分析。' };
  }
  renderChatMessages();
}

function parseItemFromAI(text) {
  // 尝试提取JSON对象
  const match = text.match(/\{[\s\S]*\}/);
  if (match) {
    try {
      const json = JSON.parse(match[0]);
      if (json.name && json.price) {
        return {
          name: json.name,
          price: parseFloat(json.price) || 0,
          quantity: parseInt(json.quantity) || 1,
          category: json.category || '📦 其他'
        };
      }
    } catch (e) {}
  }
  return null;
}

function addItemFromCard(card) {
  // 一键添加物品
  const newItem = {
    id: Date.now(),
    name: card.name,
    price: card.price,
    quantity: card.quantity,
    purchaseDate: '',
    expireDate: '',
    openDate: '',
    openUseDays: '',
    room: state.rooms[0]?.name || '',
    furniture: '',
    category: card.category || '📦 其他',
    status: '✅ 在用',
    tags: [],
    notes: '',
    photos: [],
    dailyPrice: 0,
  };
  newItem.dailyPrice = calcDailyPrice(newItem);
  state.items.push(newItem);
  generateReminders();
  showToast('已添加物品：' + card.name);
  renderChatMessages(); // 刷新聊天，移除按钮
}

// 未配置密钥 / 离线时的本地智能分析回复
function buildLocalReply(text, images) {
  const hasImg = images && images.length > 0;
  const lower = (text || '').toLowerCase();
  let reply = '';
  if (hasImg) {
    reply += '📷 收到你发来的图片啦！当前模型不支持识图，配置支持多模态的API（如GPT-4o）后，我可以精准识别图中物品并帮你一键添加记录。\n\n';
  }
  if (lower.includes('资产') || lower.includes('统计') || lower.includes('概况')) {
    const total = state.items.reduce((s,i)=>s+i.price*i.quantity,0);
    const totalQty = state.items.reduce((s,i)=>s+i.quantity,0);
    const daily = state.items.reduce((s,i)=>s+parseFloat(i.dailyPrice||0),0);
    reply += `📊 资产概况：\n• 总资产：¥${Number(total).toLocaleString()}\n• 物品总数：${totalQty}\n• 日均成本：¥${daily.toFixed(2)}\n\n💡 建议：把资产按房间/分类查看，更容易发现重复消费。`;
  } else if (lower.includes('过期') || lower.includes('提醒') || lower.includes('食品')) {
    const expiring = state.reminders.filter(r => r.status !== 'expired');
    reply += expiring.length
      ? `⏰ 即将过期（${expiring.length}件）：\n${expiring.slice(0,8).map(r=>`• ${r.name}（${r.days}天后，${r.room}·${r.furniture}）`).join('\n')}\n\n💡 建议：临期食品优先消耗，建立"先进先出"取用顺序。`
      : '✅ 目前没有即将过期的物品，做得很好！';
  } else if (lower.includes('闲置') || lower.includes('减少') || lower.includes('断舍离')) {
    const idle = state.items.filter(i => i.status && i.status.includes('闲置'));
    reply += idle.length
      ? `📦 闲置物品（${idle.length}件）：\n${idle.slice(0,6).map(i=>`• ${i.name}`).join('\n')}\n\n💡 建议：超过3个月不用的物品可考虑"送人/卖出"，回笼空间与资金。`
      : '🎉 暂未标记闲置物品，可以给不常用的物品打上"闲置"状态便于梳理。';
  } else if (lower.includes('冰箱') || lower.includes('厨房') || lower.includes('食物')) {
    reply += '🧊 冰箱收纳建议：\n1. 分区：上层熟食、下层生食，门架放调料\n2. 标签：开封后标注开封日期\n3. 先进先出：新买的后放，旧的靠前\n4. 每周清点一次临期食材';
  } else if (lower.includes('化妆') || lower.includes('护肤') || lower.includes('保质期')) {
    reply += '💄 化妆品保质期管理：\n1. 开封后使用期限：一般6-12个月\n2. 录入时填写"开封日期"+"开封后使用期限"\n3. 临期前15/7天我会提醒你\n4. 眼妆、防晒优先消耗';
  } else if (lower.includes('收纳') || lower.includes('整理') || lower.includes('建议') || lower.includes('整洁')) {
    reply += '🗂️ 通用收纳建议：\n1. 按使用频率分层：常用→顺手位置，少用→高处/深处\n2. 同类集中：同分类物品放同一家具\n3. 透明收纳盒+标签，一眼可见\n4. 定期（每月）盘点，处理过期/闲置\n5. 一进一出原则，避免无限制囤积';
  } else if (lower.includes('闲置') || lower.includes('处理') || lower.includes('断舍离') || lower.includes('找出')) {
    const idle = state.items.filter(i => i.status && (i.status.includes('闲置') || i.status.includes('破损')));
    reply += idle.length
      ? `♻️ 为你找出可处理物品（${idle.length}件）：\n${idle.slice(0,6).map(i=>`• ${i.name}（${i.room||''}·${i.furniture||''}）`).join('\n')}\n\n💡 建议：闲置可"卖出/送人"回笼空间；破损建议直接丢弃。`
      : '🎉 暂未标记闲置/破损物品，可以定期梳理并打上状态标签。';
  } else if (lower.includes('分析') || lower.includes('数据') || lower.includes('资产') || lower.includes('统计') || lower.includes('概况')) {
    const total = state.items.reduce((s,i)=>s+i.price*i.quantity,0);
    const totalQty = state.items.reduce((s,i)=>s+i.quantity,0);
    const daily = state.items.reduce((s,i)=>s+parseFloat(i.dailyPrice||0),0);
    const byRoom = {};
    state.items.forEach(i => { byRoom[i.room] = (byRoom[i.room]||0) + i.price*i.quantity; });
    const topRoom = Object.entries(byRoom).sort((a,b)=>b[1]-a[1])[0];
    reply += `📊 你的收纳数据诊断：\n• 总资产：¥${Number(total).toLocaleString()}\n• 物品总数：${totalQty}\n• 日均成本：¥${daily.toFixed(2)}\n\n`;
    if (topRoom) reply += `🏠 资产最集中的房间：${topRoom[0]}（¥${Number(topRoom[1]).toLocaleString()}）\n\n`;
    reply += '💡 建议：\n1. 对高价值房间做一次"是否常用"复盘\n2. 闲置率高的分类优先断舍离\n3. 食品/护肤品关注临期提醒，避免浪费';
  } else {
    reply += '🐻 我可以先给你一些基础建议～\n\n';
    reply += '💡 试试点下方快捷语或问我：\n• "分析我的收纳数据并给出建议"\n• "我的家怎么收纳更整洁"\n• "帮我找出闲置物品并给处理建议"\n\n配置 API Key 后我能结合你的真实数据给出更精准的分析哦！';
  }
  return reply;
}

function openEntry(itemId) {
  state.editingItem = itemId ? state.items.find(i => i.id === itemId) : null;

  page.classList.add('no-page-pad');
  page.classList.add('active');

  state.currentPage = 'entry';
  renderEntryPage();
}

function renderEntryPage() {
  const page = $('#page-entry');
  page.classList.add('no-page-pad');
  const editing = state.editingItem;
  const f = state.settings.formFields;
  const photos = (state._currentPhotos && state._currentPhotos.length > 0) ? state._currentPhotos : (editing ? [...editing.photos] : []);
  state._currentPhotos = photos;

  page.innerHTML = `
    <div class="entry-header" style="position:sticky;top:0;z-index:10;">
      <div class="back-btn" onclick="showPage('items')">✕</div>
      <h2>${editing ? '编辑物品' : '添加物品'}</h2>
      <div style="width:36px;"></div>
    </div>
    <div style="padding:12px 0 0;">
      ${f.photo ? `
      <div class="form-group">
        <label>📷 照片（最多3张，第一张为封面）</label>
        <div class="photo-upload" id="photoUpload" style="margin-top:6px;"></div>
        <div class="photo-hint">连续点击2次非首张照片可设为封面；拖拽可调整顺序；× 删除。相册支持一次选多张（最多3张）。</div>
      </div>` : ''}

      <div class="entry-tabs">
        <div class="entry-tab" onclick="addPhoto('camera')"><div class="eicon">📸</div><div class="etext">拍照录入</div></div>
        <div class="entry-tab" onclick="addPhoto('album')"><div class="eicon">🖼️</div><div class="etext">上传照片</div></div>
      </div>

      ${f.name ? `<div class="form-group"><label>物品名称 *</label><input type="text" id="f_name" value="${editing?.name || ''}" placeholder="如：精华液"></div>` : ''}
      <div class="form-row">
        ${f.price ? `<div class="form-group"><label>单价 (¥)</label><input type="number" id="f_price" value="${editing?.price || ''}" placeholder="0"></div>` : ''}
        ${f.quantity ? `<div class="form-group"><label>数量</label><input type="number" id="f_quantity" value="${editing?.quantity || 1}" placeholder="1"></div>` : ''}
      </div>
      ${f.purchaseDate ? `<div class="form-group"><label>📅 购买日期</label><input type="date" id="f_purchaseDate" value="${editing?.purchaseDate || ''}"></div>` : ''}
      ${f.expireDate ? `<div class="form-group"><label>⏰ 过期时日期</label><input type="date" id="f_expireDate" value="${editing?.expireDate || ''}"></div>` : ''}
      ${f.openDate ? `<div class="form-group"><label>📅 开封日期</label><input type="date" id="f_openDate" value="${editing?.openDate || ''}"></div>` : ''}
      ${f.openUseDays ? `<div class="form-group"><label>📝 开封后使用期限(天)</label><input type="number" id="f_openUseDays" value="${editing?.openUseDays || ''}" placeholder="如：365"></div>` : ''}
      <div class="form-row">
        ${f.room ? `<div class="form-group">
          <label>🏠 所在房间</label>
          <select id="f_room" onchange="updateFurnitureOptions()">
            ${state.rooms.map(r => `<option ${editing?.room === r.name ? 'selected' : ''}>${r.name}</option>`).join('')}
          </select>
        </div>` : ''}
        ${f.furniture ? `<div class="form-group">
          <label>🪑 放置家具</label>
          <select id="f_furniture"></select>
        </div>` : ''}
      </div>
      ${f.category ? `<div class="form-group">
        <label>📂 分类</label>
        <select id="f_category">${state.categories.map(c => `<option ${editing?.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>

      ${f.status ? `<div class="form-group">
        <label>📌 状态</label>
        <select id="f_status">${state.statuses.map(s => `<option ${editing?.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>

        </div>
      </div>` : ''}

function updateFurnitureOptions() {
  const roomSel = document.getElementById('f_room');
  const furnSel = document.getElementById('f_furniture');
  if (!roomSel || !furnSel) return;
  const room = state.rooms.find(r => r.name === roomSel.value);
  const editing = state.editingItem;
  furnSel.innerHTML = room.furniture.map(f => `<option ${editing?.furniture === f.name ? 'selected' : ''}>${f.name}</option>`).join('');
}

function toggleTagChip(el, tag) {
  el.classList.toggle('selected');
  if (!state.selectedTags.includes(tag)) state.selectedTags.push(tag);
  else state.selectedTags = state.selectedTags.filter(t => t !== tag);
}

// 渲染照片上传区
function renderPhotoUpload() {
  const wrap = document.getElementById('photoUpload');
  if (!wrap) return;
  const photos = state._currentPhotos || [];
  const f = state.settings.formFields;
  if (!f.photo) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    ${photos.map((p, i) => `
      <div class="photo-thumb draggable ${i === 0 ? 'is-cover' : ''}"
        draggable="true"
        ondragstart="photoDragStart(${i},event)"
        ondragover="photoDragOver(event)"
        ondrop="photoDrop(event,${i})"
        ontouchstart="photoDragStart(${i},event)"
        onclick="onPhotoClick(${i})">
        <img src="${p}" style="width:100%;height:100%;object-fit:cover;">
        ${i === 0 ? '<div class="cover-badge">封面</div>' : '<div class="cover-set">双击设为封面</div>'}
        <div class="remove" onclick="removePhoto(${i});event.stopPropagation()">✕</div>
      </div>
    `).join('')}
    ${photos.length < 3 ? `<div class="photo-thumb add" onclick="addPhoto('album')" title="添加照片">＋</div>` : ''}
  `;
}

function addPhoto(mode) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  if (mode === 'album') input.multiple = true;
  if (mode === 'camera') input.capture = 'environment'; // 后置摄像头
  input.onchange = (e) => {
    const files = e.target.files;
    if (!files || !files.length) return;
    if (!state._currentPhotos) state._currentPhotos = [];
    const remain = 3 - state._currentPhotos.length;
    if (remain <= 0) { showToast('最多只能添加3张照片'); return; }
    let pending = 0, skipped = 0;
    const list = Array.from(files).slice(0, remain);
    list.forEach(file => {
      if (!file.type.startsWith('image/')) { skipped++; return; }
      pending++;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state._currentPhotos.push(ev.target.result);
        renderPhotoUpload();
        pending--;
        if (pending === 0) {
          showToast(mode === 'camera'
            ? '照片已拍摄'
            : (list.length - skipped > 1 ? `已添加 ${list.length - skipped} 张照片` : '照片已上传'));
          if (skipped > 0) showToast(`跳过 ${skipped} 个非图片文件`);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

// 单击照片：双击检测逻辑
let lastClickTime = 0;
let lastClickedIndex = -1;
function onPhotoClick(index) {
  const now = Date.now();
  if (index === lastClickedIndex && (now - lastClickTime) < 300) {
    // 双击
    if (index !== 0) {
      setCover(index);
    }
    lastClickTime = 0;
    lastClickedIndex = -1;
  } else {
    lastClickTime = now;
    lastClickedIndex = index;
  }
}

function removePhoto(index) {
  if (!state._currentPhotos) return;
  state._currentPhotos.splice(index, 1);
  renderEntryPage();
}

function setCover(index) {
  if (!state._currentPhotos || index < 0 || index >= state._currentPhotos.length) return;
  const [item] = state._currentPhotos.splice(index, 1);
  state._currentPhotos.unshift(item);
  renderEntryPage();
  showToast('已设为封面');
}

let dragIdx = -1, dragStartX = 0, dragStartY = 0, dragEl = null, dragList = [], dragMoved = false;

function photoDragStart(i, ev) {
  if (ev.type === 'pointerdown' && ev.button !== 0) return;
  dragIdx = i; dragMoved = false;
  dragList = Array.from(document.querySelectorAll('.photo-thumb.draggable'));
  dragEl = dragList[i];
  const t = ev.type === 'touchstart' ? ev.touches[0] : ev;
  dragStartX = t.clientX; dragStartY = t.clientY;
  dragEl.classList.add('dragging');
  if (ev.type === 'touchstart') {
    document.addEventListener('touchmove', photoDragMove, { passive: false });
    document.addEventListener('touchend', photoDragEnd);
  } else {
    document.addEventListener('pointermove', photoDragMove);
    document.addEventListener('pointerup', photoDragEnd);
  }
}

function photoDragMove(ev) {
  if (dragIdx < 0 || !dragEl) return;
  const t = ev.touches ? ev.touches[0] : ev;
  const dx = t.clientX - dragStartX, dy = t.clientY - dragStartY;
  if (!dragMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  dragMoved = true;
  if (ev.cancelable) ev.preventDefault();
  dragEl.style.transform = `translate(${dx}px, ${dy}px)`;
  dragEl.style.zIndex = '100';
  let overIdx = dragIdx;
  dragList.forEach((el, idx) => {
    if (el === dragEl) return;
    const r = el.getBoundingClientRect();
    if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) overIdx = idx;
  });
  if (overIdx !== dragIdx) {
    const cur = state._currentPhotos.splice(dragIdx, 1)[0];
    state._currentPhotos.splice(overIdx, 0, cur);
    dragIdx = overIdx;
    renderEntryPage();
    dragList = Array.from(document.querySelectorAll('.photo-thumb.draggable'));
    dragEl = dragList[dragIdx];
    if (dragEl) { const r = dragEl.getBoundingClientRect(); dragStartX = t.clientX - r.left; dragStartY = t.clientY - r.top; dragEl.classList.add('dragging'); }
  }
}

function photoDragEnd() {
  document.removeEventListener('touchmove', photoDragMove);
  document.removeEventListener('touchend', photoDragEnd);
  document.removeEventListener('pointermove', photoDragMove);
  document.removeEventListener('pointerup', photoDragEnd);
  if (dragEl) dragEl.classList.remove('dragging');
  dragEl = null; dragIdx = -1; dragList = [];
  if (dragMoved) renderEntryPage();
}

function photoDragOver(ev) { ev.preventDefault(); }
function photoDrop(ev, i) {
  ev.preventDefault();
  const from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
  if (isNaN(from) || from === i) return;
  const cur = state._currentPhotos.splice(from, 1)[0];
  state._currentPhotos.splice(i, 0, cur);
  renderEntryPage();
}

function saveItem(continueAdding) {
  const f = state.settings.formFields;
  const getValue = (id) => document.getElementById(id)?.value || '';

  const itemData = {
    name: getValue('f_name') || '未命名',
    price: parseFloat(getValue('f_price')) || 0,
    quantity: parseInt(getValue('f_quantity')) || 1,
    purchaseDate: getValue('f_purchaseDate'),
    expireDate: getValue('f_expireDate'),
    openDate: getValue('f_openDate'),
    openUseDays: getValue('f_openUseDays') || '',
    room: getValue('f_room'),
    furniture: getValue('f_furniture'),
    category: getValue('f_category') || state.categories[0],
    status: getValue('f_status') || '✅ 在用',
    tags: [...state.selectedTags],
    notes: getValue('f_notes'),
    photos: state._currentPhotos || [],
    dailyPrice: 0,
  };
  itemData.dailyPrice = calcDailyPrice(itemData);

  if (state.editingItem) {
    Object.assign(state.editingItem, itemData);
    showToast('物品已更新');
  } else {
    const newItem = { id: Date.now(), ...itemData };
    state.items.push(newItem);
    showToast('物品已添加');
  }

  state.selectedTags = [];
  generateReminders();

  if (!continueAdding) {
    showPage('items');
  } else {
    state.editingItem = null;
    state._currentPhotos = [];
    state.selectedTags = [];
    renderEntryPage();
  }
  renderItems();
  renderHome();
}

}

function bindKeyboardAdjust() {
  const phone = document.querySelector('.phone');
  if (!phone || !window.visualViewport) return;
  const vv = window.visualViewport;
  const onResize = () => {
    const chatPage = document.getElementById('page-ai');
    if (!chatPage || !chatPage.classList.contains('active')) return;
    const offset = window.innerHeight - vv.height - vv.offsetTop;
    const bar = chatPage.querySelector('.chat-input-bar');
    if (bar) bar.style.bottom = (offset > 0 ? offset : 0) + 'px';
  };
  vv.addEventListener('resize', onResize);
  vv.addEventListener('scroll', onResize);
}
