        async function sendChat() {
            const input = document.getElementById('chatInput');
            const text = (input && input.value || '').trim();
            if (!text && pendingImages.length === 0) return;
            if (input) input.value = '';
            autoResizeChatInput();
            updateChatSendBtn();
            const userImages = pendingImages.slice();
            pendingImages = [];
            renderAttachPreview();
            chatHistory.push({
                role: 'user',
                content: text || (userImages.length ? '📷 这是拍的照片/相册选的图，帮我识别并记录～' : ''),
                images: userImages
            });
            renderChatMessages();
            const loadingIdx = chatHistory.length;
            chatHistory.push({ role: 'bot', content: '🐻 正在思考...' });
            renderChatMessages();

            if (!state.apiKey) {
                setTimeout(() => {
                    chatHistory[loadingIdx] = { role: 'bot', content: buildLocalReply(text, userImages) };
                    renderChatMessages();
                }, 500);
                return;
            }

            const supportsVision = state.aiModel.includes('gpt-4o') || state.aiModel.includes('vision') || state
                .aiModel.includes('vl') || state.aiModel.includes('ocr') || state.aiModel.includes('glm') || state
                .aiModel.includes('qwen') || state.aiModel.includes('doubao');
            let imagesToSend = userImages;
            if (!supportsVision && userImages.length > 0) {
                imagesToSend = [];
                chatHistory.push({
                    role: 'bot',
                    content: '🐻 当前模型不支持直接识别图片。\n\n💡 建议：在设置中切换为 "GPT-4o" 等支持多模态的模型，并配置对应的 API Key。\n\n或者，你可以先用文字描述一下图片里的物品，我来帮你生成记录~'
                });
                renderChatMessages();
                return;
            }

            const totalQty = state.items.reduce((s, i) => s + i.quantity, 0);
            const totalAsset = state.items.reduce((s, i) => s + i.price * i.quantity, 0);
            const expiring = state.reminders.filter(r => r.status !== 'expired').map(r =>
                `${r.name}(${r.days}天)`).join('、') || '无';
            const idleItems = state.items.filter(i => i.status && i.status.includes('闲置')).slice(0, 8).map(i => i
                .name).join('、') || '无';
            const systemPrompt = `你是"暖居收纳"APP的AI助手"小兜"，一只可爱的小熊。你的任务是：
        1. 分析用户的物品收纳数据，给出实用、可执行的收纳建议
        2. 用户发送的图片可能是物品/商品/收纳场景，请识别并帮助记录或分析
        3. 闲聊陪伴、鼓励用户保持整洁

        当前用户数据概览：
        - 物品总数：${totalQty}
        - 资产总值：¥${Number(totalAsset).toLocaleString()}
        - 空间：${state.rooms.map(r=>r.name).join('、')}
        - 分类：${state.categories.join('、')}
        - 即将过期：${expiring}
        - 闲置物品：${idleItems}

        当用户发送图片时，请仔细识别图片中的物品，并按照以下JSON格式回复（不要包含额外解释，直接输出JSON）：
        {"name":"物品名称","price":数值,"quantity":数值,"category":"分类（从给定分类中选择）"}
        如果无法识别，请回复"抱歉，我没能识别出物品信息，请提供更多细节"。

        请用中文回复，语气亲切可爱，适当使用emoji。`;
            const recent = chatHistory.slice(-12);
            const messages = [{ role: 'system', content: systemPrompt }];
            for (const m of recent) {
                if (m.content === '🐻 正在思考...') continue;
                if (m.role === 'user') {
                    const parts = [];
                    if (m.content) parts.push({ type: 'text', text: m.content });
                    (m.images || []).forEach(src => parts.push({ type: 'image_url', image_url: { url: src } }));
                    messages.push({
                        role: 'user',
                        content: parts.length === 1 && parts[0].type === 'text' ? parts[0].text : parts
                    });
                } else {
                    messages.push({ role: 'assistant', content: m.content });
                }
            }
            try {
                const response = await fetch(`${state.apiBase}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` },
                    body: JSON.stringify({ model: state.aiModel, messages, stream: false })
                });
                if (!response.ok) throw new Error('API请求失败 ' + response.status);
                const data = await response.json();
                const reply = (data.choices && data.choices[0] && data.choices[0].message.content) ||
                    '（没有得到回复内容）';
                const parsed = parseItemFromAI(reply);
                if (parsed) chatHistory[loadingIdx] = { role: 'bot', content: reply, itemCard: parsed };
                else chatHistory[loadingIdx] = { role: 'bot', content: reply };
            } catch (err) {
                console.error(err);
                chatHistory[loadingIdx] = {
                    role: 'bot',
                    content: buildLocalReply(text, userImages) +
                        '\n\n⚠️ 刚才有道联网请求出错，已切换为本地分析。'
                };
            }
            renderChatMessages();
        }

        function parseItemFromAI(text) {
            const match = text.match(/\{[\s\S]*\}/);
            if (match) {
                try {
                    const json = JSON.parse(match[0]);
                    if (json.name && json.price) {
                        return {
                            name: json.name,
                            price: parseFloat(json.price) || 0,
                            quantity: parseInt(json.quantity) || 1,
                            category: json.category || '📦 其他'
                        };
                    }
                } catch (e) {}
            }
            return null;
        }

        function addItemFromCard(card) {
            if (!card || !card.name) return;
            const newItem = {
                id: Date.now(),
                name: card.name,
                price: card.price || 0,
                quantity: card.quantity || 1,
                purchaseDate: '',
                expireDate: '',
                openDate: '',
                openUseDays: '',
                room: (state.rooms[0]?.name || ''),
                furniture: '',
                category: card.category || '📦 其他',
                status: '✅ 在用',
                tags: [],
                notes: '',
                photos: [],
                dailyPrice: 0,
            };
            newItem.dailyPrice = calcDailyPrice(newItem);
            state.items.push(newItem);
            generateReminders();
            showToast('已添加物品：' + card.name);
            renderChatMessages();
            saveState();
        }

        function buildLocalReply(text, images) {
            const hasImg = images && images.length > 0;
            const lower = (text || '').toLowerCase();
            let reply = '';
            if (hasImg) reply +=
                '📷 收到你发来的图片啦！当前模型不支持识图，配置支持多模态的API（如GPT-4o）后，我可以精准识别图中物品并帮你一键添加记录。\n\n';
            if (lower.includes('资产') || lower.includes('统计') || lower.includes('概况')) {
                const total = state.items.reduce((s, i) => s + i.price * i.quantity, 0);
                const totalQty = state.items.reduce((s, i) => s + i.quantity, 0);
                const daily = state.items.reduce((s, i) => s + parseFloat(i.dailyPrice || 0), 0);
                reply +=
                    `📊 资产概况：\n• 总资产：¥${Number(total).toLocaleString()}\n• 物品总数：${totalQty}\n• 日均成本：¥${daily.toFixed(2)}\n\n💡 建议：把资产按空间/分类查看，更容易发现重复消费。`;
            } else if (lower.includes('过期') || lower.includes('提醒') || lower.includes('食品')) {
                const expiring = state.reminders.filter(r => r.status !== 'expired');
                reply += expiring.length ?
                    `⏰ 即将过期（${expiring.length}件）：\n${expiring.slice(0,8).map(r=>`• ${r.name}（${r.days}天后，${r.room}·${r.furniture}）`).join('\n')}\n\n💡 建议：临期食品优先消耗，建立"先进先出"取用顺序。` :
                    '✅ 目前没有即将过期的物品，做得很好！';
            } else if (lower.includes('闲置') || lower.includes('减少') || lower.includes('断舍离')) {
                const idle = state.items.filter(i => i.status && i.status.includes('闲置'));
                reply += idle.length ?
                    `📦 闲置物品（${idle.length}件）：\n${idle.slice(0,6).map(i=>`• ${i.name}`).join('\n')}\n\n💡 建议：超过3个月不用的物品可考虑"送人/卖出"，回笼空间与资金。` :
                    '🎉 暂未标记闲置物品，可以给不常用的物品打上"闲置"状态便于梳理。';
            } else if (lower.includes('冰箱') || lower.includes('厨房') || lower.includes('食物')) {
                reply +=
                    '🧊 冰箱收纳建议：\n1. 分区：上层熟食、下层生食，门架放调料\n2. 标签：启封后标注启用日期\n3. 先进先出：新买的后放，旧的靠前\n4. 每周清点一次临期食材';
            } else if (lower.includes('化妆') || lower.includes('护肤') || lower.includes('保质期')) {
                reply +=
                    '💄 化妆品保质期管理：\n1. 启用效期：一般6-12个月\n2. 录入时填写"启封日期"+"启封效期"\n3. 临期前15/7天我会提醒你\n4. 眼妆、防晒优先消耗';
            } else if (lower.includes('收纳') || lower.includes('整理') || lower.includes('建议') || lower.includes(
                    '整洁')) {
                reply +=
                    '🗂️ 通用收纳建议：\n1. 按使用频率分层：常用→顺手位置，少用→高处/深处\n2. 同类集中：同分类物品放同一位置\n3. 透明收纳盒+标签，一眼可见\n4. 定期（每月）盘点，处理过期/闲置\n5. 一进一出原则，避免无限制囤积';
            } else if (lower.includes('分析') || lower.includes('数据')) {
                const total = state.items.reduce((s, i) => s + i.price * i.quantity, 0);
                const totalQty = state.items.reduce((s, i) => s + i.quantity, 0);
                const daily = state.items.reduce((s, i) => s + parseFloat(i.dailyPrice || 0), 0);
                const byRoom = {};
                state.items.forEach(i => { byRoom[i.room] = (byRoom[i.room] || 0) + i.price * i.quantity; });
                const topRoom = Object.entries(byRoom).sort((a, b) => b[1] - a[1])[0];
                reply +=
                    `📊 你的收纳数据诊断：\n• 总资产：¥${Number(total).toLocaleString()}\n• 物品总数：${totalQty}\n• 日均成本：¥${daily.toFixed(2)}\n\n`;
                if (topRoom) reply +=
                    `🏠 资产最集中的空间：${topRoom[0]}（¥${Number(topRoom[1]).toLocaleString()}）\n\n`;
                reply +=
                    '💡 建议：\n1. 对高价值空间做一次"是否常用"复盘\n2. 闲置率高的分类优先断舍离\n3. 食品/护肤品关注临期提醒，避免浪费';
            } else if (lower.includes('处理') || lower.includes('找出')) {
                const idle = state.items.filter(i => i.status && (i.status.includes('闲置') || i.status.includes(
                    '破损')));
                reply += idle.length ?
                    `♻️ 为你找出可处理物品（${idle.length}件）：\n${idle.slice(0,6).map(i=>`• ${i.name}（${i.room||''}·${i.furniture||''}）`).join('\n')}\n\n💡 建议：闲置可"卖出/送人"回笼空间；破损建议直接丢弃。` :
                    '🎉 暂未标记闲置/破损物品，可以定期梳理并打上状态标签。';
            } else {
                reply += '🐻 我可以先给你一些基础建议～\n\n';
                reply +=
                    '💡 试试点下方快捷语或问我：\n• "分析我的收纳数据并给出建议"\n• "我的家怎么收纳更整洁"\n• "帮我找出闲置物品并给处理建议"\n\n配置 API Key 后我能结合你的真实数据给出更精准的分析哦！';
            }
            return reply;
        }

                <div class="detail-row"><div class="dl">购买日期</div><div class="dv">${escapeHtml(item.purchaseDate || '-')}</div></div>
                <div class="detail-row"><div class="dl">过期日期</div><div class="dv">${escapeHtml(expireDisplay)}</div></div>
                <div class="detail-row"><div class="dl">启封日期</div><div class="dv">${escapeHtml(item.openDate || '-')}</div></div>
                <div class="detail-row"><div class="dl">启用效期</div><div class="dv">${item.openUseDays ? escapeHtml(item.openUseDays) + '天' : '-'}</div></div>
                <div class="detail-row"><div class="dl">空间</div><div class="dv">${escapeHtml(item.room || '-')}</div></div>
                <div class="detail-row"><div class="dl">位置</div><div class="dv">${escapeHtml(item.furniture || '-')}</div></div>
                <div class="detail-row"><div class="dl">分类</div><div class="dv">${escapeHtml(item.category || '-')}</div></div>
                <div class="detail-row"><div class="dl">状态</div><div class="dv">${escapeHtml(item.status || '-')}</div></div>
                <div class="detail-row"><div class="dl">标签</div><div class="dv">${tagHtml}</div></div>
                <div class="detail-row"><div class="dl">备注</div><div class="dv">${escapeHtml(item.notes || '-')}</div></div>
              </div>
            </div>
          `;
        }

        function backFromDetail() {
            if (state.selectedFurniture) {
                const { room, furniture } = state.selectedFurniture;
                openFurniture(room, furniture);
            } else {
                showPage('items');
            }
        }

        function deleteItem(id) {
            if (confirm('确定删除该物品？')) {
                state.items = state.items.filter(i => i.id !== id);
                generateReminders();
                renderItems();
                showPage('items');
                showToast('物品已删除');
                saveState();
            }
        }

        // ========== 录入页面 ==========
        function openEntry(itemId) {
            state.editingItem = itemId ? state.items.find(i => i.id === itemId) : null;
            state.selectedTags = state.editingItem ? [...(state.editingItem.tags || [])] : [];
            state._currentPhotos = state.editingItem ? [...(state.editingItem.photos || [])] : [];
            const page = $('#page-entry');
            page.classList.add('no-page-pad');
            page.classList.add('active');
            $$('.page').forEach(p => { if (p.id !== 'page-entry') p.classList.remove('active'); });
            state.currentPage = 'entry';
            renderEntryPage();
        }

        function renderEntryPage() {
            const page = $('#page-entry');
            page.classList.add('no-page-pad');
            const editing = state.editingItem;
            const f = state.settings.formFields;
            const photos = state._currentPhotos || [];
            page.innerHTML = `
            <div class="entry-header" style="position:sticky;top:0;z-index:10;">
              <div class="back-btn" onclick="showPage('items')">✕</div>
              <h2>${editing ? '编辑物品' : '添加物品'}</h2>
              <div style="width:36px;"></div>
            </div>
            <div style="padding:12px 0 0;">
              ${f.photo ? `<div class="form-group"><label>📷 照片（最多3张，第一张为封面）</label><div class="photo-upload" id="photoUpload" style="margin-top:6px;"></div><div class="photo-hint">连续点击2次非首张照片可设为封面；拖拽可调整顺序；× 删除。相册支持一次选多张（最多3张）。</div></div>` : ''}
              <div class="entry-tabs">
                <div class="entry-tab" onclick="addPhoto('camera')"><div class="eicon">📸</div><div class="etext">拍照录入</div></div>
                <div class="entry-tab" onclick="addPhoto('album')"><div class="eicon">🖼️</div><div class="etext">上传照片</div></div>
              </div>
              ${f.name ? `<div class="form-group"><label>物品名称 *</label><input type="text" id="f_name" value="${escapeHtml(editing?.name || '')}" placeholder="如：精华液"></div>` : ''}
              <div class="form-row">
                ${f.price ? `<div class="form-group"><label>单价 (¥)</label><input type="number" id="f_price" value="${editing?.price || ''}" placeholder="0"></div>` : ''}
                ${f.quantity ? `<div class="form-group"><label>数量</label><input type="number" id="f_quantity" value="${editing?.quantity || 1}" placeholder="1"></div>` : ''}
              </div>
              ${f.purchaseDate ? `<div class="form-group"><label>📅 购买日期</label><input type="date" id="f_purchaseDate" value="${editing?.purchaseDate || ''}"></div>` : ''}
              ${f.expireDate ? `<div class="form-group"><label>⏰ 过期日期</label><input type="date" id="f_expireDate" value="${editing?.expireDate || ''}"></div>` : ''}
              ${f.openDate ? `<div class="form-group"><label>📅 启封日期</label><input type="date" id="f_openDate" value="${editing?.openDate || ''}"></div>` : ''}
              ${f.openUseDays ? `<div class="form-group"><label>📝 启用效期(天)</label><input type="number" id="f_openUseDays" value="${editing?.openUseDays || ''}" placeholder="如：365"></div>` : ''}
              <div class="form-row">
                ${f.room ? `<div class="form-group"><label>🏠 所在空间</label><select id="f_room" onchange="updateFurnitureOptions()">${state.rooms.map(r => `<option value="${escapeHtml(r.name)}" ${editing?.room === r.name ? 'selected' : ''}>${escapeHtml(r.name)}</option>`).join('')}</select></div>` : ''}
                ${f.furniture ? `<div class="form-group"><label>🪑 存放位置</label><select id="f_furniture"></select></div>` : ''}
              </div>
              ${f.category ? `<div class="form-group"><label>📂 分类</label><select id="f_category">${state.categories.map(c => `<option value="${escapeHtml(c)}" ${editing?.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select></div>` : ''}
              ${f.status ? `<div class="form-group"><label>📌 状态</label><select id="f_status">${state.statuses.map(s => `<option value="${escapeHtml(s)}" ${editing?.status === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></div>` : ''}
              ${f.tags ? `<div class="form-group"><label>🏷️ 标签（可多选）</label><div class="chip-group" id="tagChips" style="margin-top:6px;">${state.tags.map(t => `<span class="chip ${state.selectedTags.includes(t) ? 'selected' : ''}" onclick="toggleTagChip(this,'${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}</div></div>` : ''}
              ${f.notes ? `<div class="form-group"><label>📝 备注</label><input type="text" id="f_notes" value="${escapeHtml(editing?.notes || '')}" placeholder="补充说明..."></div>` : ''}
              <div class="entry-form-actions">
                <button class="btn-cancel" onclick="showPage('items')">取消</button>
                <button class="btn-save" onclick="saveItem(false)">保存</button>
                <button class="btn-save" onclick="saveItem(true)">保存+继续</button>
              </div>
            </div>
          `;
            updateFurnitureOptions();
            renderPhotoUpload();
        }

        function updateFurnitureOptions() {
            const roomSel = document.getElementById('f_room');
            const furnSel = document.getElementById('f_furniture');
            if (!roomSel || !furnSel) return;
            const room = state.rooms.find(r => r.name === roomSel.value);
            if (!room) {
                furnSel.innerHTML = '';
                return;
            }
            const editing = state.editingItem;
            furnSel.innerHTML = room.furniture.map(f =>
                `<option value="${escapeHtml(f.name)}" ${editing?.furniture === f.name ? 'selected' : ''}>${escapeHtml(f.name)}</option>`
                ).join('');
        }

        function toggleTagChip(el, tag) {
            el.classList.toggle('selected');
            if (!state.selectedTags.includes(tag)) state.selectedTags.push(tag);
            else state.selectedTags = state.selectedTags.filter(t => t !== tag);
        }

        function renderPhotoUpload() {
            const wrap = document.getElementById('photoUpload');
            if (!wrap) return;
            const photos = state._currentPhotos || [];
            const f = state.settings.formFields;
            if (!f.photo) {
                wrap.innerHTML = '';
                return;
            }
            wrap.innerHTML = `
            ${photos.map((p, i) => `<div class="photo-thumb draggable ${i === 0 ? 'is-cover' : ''}" draggable="true" ondragstart="photoDragStart(${i},event)" ondragover="photoDragOver(event)" ondrop="photoDrop(event,${i})" ontouchstart="photoDragStart(${i},event)" onclick="onPhotoClick(${i})"><img src="${escapeHtml(p)}" style="width:100%;height:100%;object-fit:cover;" alt="">${i === 0 ? '<div class="cover-badge">封面</div>' : '<div class="cover-set">双击设为封面</div>'}<div class="remove" onclick="removePhoto(${i});event.stopPropagation()">✕</div></div>`).join('')}
            ${photos.length < 3 ? `<div class="photo-thumb add" onclick="addPhoto('album')" title="添加照片">＋</div>` : ''}
          `;
        }

        function addPhoto(mode) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            if (mode === 'album') input.multiple = true;
            if (mode === 'camera') input.capture = 'environment';
            input.onchange = (e) => {
                const files = e.target.files;
                if (!files || !files.length) return;
                if (!state._currentPhotos) state._currentPhotos = [];
                const remain = 3 - state._currentPhotos.length;
                if (remain <= 0) {
                    showToast('最多只能添加3张照片');
                    return;
                }
                let pending = 0,
                    skipped = 0;
                const list = Array.from(files).slice(0, remain);
                list.forEach(file => {
                    if (!file.type.startsWith('image/')) {
                        skipped++;
                        return;
                    }
                    pending++;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width,
                                height = img.height;
                            if (width > 800) {
                                height = Math.round(height * 800 / width);
                                width = 800;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            const compressed = canvas.toDataURL('image/jpeg', 0.7);
                            state._currentPhotos.push(compressed);
                            renderPhotoUpload();
                            pending--;
                            if (pending === 0) {
                                showToast(mode === 'camera' ? '照片已拍摄（已压缩）' : (list.length -
                                    skipped > 1 ? `已添加 ${list.length - skipped} 张照片（已压缩）` :
                                    '照片已上传（已压缩）'));
                                if (skipped > 0) showToast(`跳过 ${skipped} 个非图片文件`);
                            }
                        };
                        img.onerror = function() { pending--; };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };
            input.click();
        }

        let lastClickTime = 0,
            lastClickedIndex = -1;

        function onPhotoClick(index) {
            const now = Date.now();
            if (index === lastClickedIndex && (now - lastClickTime) < 300) {
                if (index !== 0) setCover(index);
                lastClickTime = 0;
                lastClickedIndex = -1;
            } else {
                lastClickTime = now;
                lastClickedIndex = index;
            }
        }

        function removePhoto(index) {
            if (!state._currentPhotos) return;
            state._currentPhotos.splice(index, 1);
            renderPhotoUpload();
        }

        function setCover(index) {
            if (!state._currentPhotos || index < 0 || index >= state._currentPhotos.length) return;
            const [item] = state._currentPhotos.splice(index, 1);
            state._currentPhotos.unshift(item);
            renderPhotoUpload();
            showToast('已设为封面');
        }

        let dragIdx = -1,
            dragStartX = 0,
            dragStartY = 0,
            dragEl = null,
            dragList = [],
            dragMoved = false;

        function photoDragStart(i, ev) {
            if (ev.type === 'pointerdown' && ev.button !== 0) return;
            dragIdx = i;
            dragMoved = false;
            dragList = Array.from(document.querySelectorAll('.photo-thumb.draggable'));
            dragEl = dragList[i];
            if (!dragEl) return;
            const t = ev.type === 'touchstart' ? ev.touches[0] : ev;
            dragStartX = t.clientX;
            dragStartY = t.clientY;
            dragEl.classList.add('dragging');
            if (ev.type === 'touchstart') {
                document.addEventListener('touchmove', photoDragMove, { passive: false });
                document.addEventListener('touchend', photoDragEnd);
            } else {
                document.addEventListener('pointermove', photoDragMove);
                document.addEventListener('pointerup', photoDragEnd);
            }
        }

        function photoDragMove(ev) {
            if (dragIdx < 0 || !dragEl) return;
            const t = ev.touches ? ev.touches[0] : ev;
            const dx = t.clientX - dragStartX,
                dy = t.clientY - dragStartY;
            if (!dragMoved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
            dragMoved = true;
            if (ev.cancelable) ev.preventDefault();
            dragEl.style.transform = `translate(${dx}px, ${dy}px)`;
            dragEl.style.zIndex = '100';
            let overIdx = dragIdx;
            dragList.forEach((el, idx) => {
                if (el === dragEl) return;
                const r = el.getBoundingClientRect();
                if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r
                    .bottom) overIdx = idx;
            });
            if (overIdx !== dragIdx) {
                const cur = state._currentPhotos.splice(dragIdx, 1)[0];
                state._currentPhotos.splice(overIdx, 0, cur);
                dragIdx = overIdx;
                renderPhotoUpload();
                dragList = Array.from(document.querySelectorAll('.photo-thumb.draggable'));
                dragEl = dragList[dragIdx];
                if (dragEl) {
                    const r = dragEl.getBoundingClientRect();
                    dragStartX = t.clientX - r.left;
                    dragStartY = t.clientY - r.top;
                    dragEl.classList.add('dragging');
                }
            }
        }

        function photoDragEnd() {
            document.removeEventListener('touchmove', photoDragMove);
            document.removeEventListener('touchend', photoDragEnd);
            document.removeEventListener('pointermove', photoDragMove);
            document.removeEventListener('pointerup', photoDragEnd);
            if (dragEl) dragEl.classList.remove('dragging');
            dragEl = null;
            dragIdx = -1;
            dragList = [];
            if (dragMoved) renderPhotoUpload();
        }

        function photoDragOver(ev) {
            ev.preventDefault();
        }

        function photoDrop(ev, i) {
            ev.preventDefault();
            const from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
            if (isNaN(from) || from === i) return;
            const cur = state._currentPhotos.splice(from, 1)[0];
            state._currentPhotos.splice(i, 0, cur);
            renderPhotoUpload();
        }

        function saveItem(continueAdding) {
            try {
                const getValue = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.value : '';
                };
                const itemData = {
                    name: getValue('f_name') || '未命名',
                    price: parseFloat(getValue('f_price')) || 0,
                    quantity: parseInt(getValue('f_quantity')) || 1,
                    purchaseDate: getValue('f_purchaseDate'),
                    expireDate: getValue('f_expireDate'),
                    openDate: getValue('f_openDate'),
                    openUseDays: getValue('f_openUseDays') || '',
                    room: getValue('f_room'),
                    furniture: getValue('f_furniture'),
                    category: getValue('f_category') || state.categories[0],
                    status: getValue('f_status') || '✅ 在用',
                    tags: [...state.selectedTags],
                    notes: getValue('f_notes'),
                    photos: state._currentPhotos || [],
                    dailyPrice: 0,
                };
                itemData.dailyPrice = calcDailyPrice(itemData);
                if (state.editingItem) {
                    Object.assign(state.editingItem, itemData);
                    showToast('物品已更新');
                } else {
                    const newItem = { id: Date.now(), ...itemData };
                    state.items.push(newItem);
                    showToast('物品已添加');
                }
                state.selectedTags = [];
                if (!continueAdding) {
                    state._currentPhotos = [];
                    showPage('items');
                } else {
                    state.editingItem = null;
                    state._currentPhotos = [];
                    state.selectedTags = [];
                    renderEntryPage();
                }
                renderItems();
                renderHome();
                generateReminders();
                saveState();
            } catch (err) {
                console.error(err);
                showToast('保存失败：' + err.message);
            }
        }

        function editItem(id) {
            openEntry(id);
        }

        function openSettings() {
            showPage('settings');
        }

        // ========== 安卓软键盘适配 ==========
        function bindKeyboardAdjust() {
            const phone = document.querySelector('.phone');
            if (!phone || !window.visualViewport) return;
            const vv = window.visualViewport;
            const onResize = () => {
                const chatPage = document.getElementById('page-ai');
                if (!chatPage || !chatPage.classList.contains('active')) return;
                const offset = window.innerHeight - vv.height - vv.offsetTop;
                const bar = chatPage.querySelector('.chat-input-bar');
                if (bar) bar.style.bottom = (offset > 0 ? offset : 0) + 'px';
            };
            vv.addEventListener('resize', onResize);
            vv.addEventListener('scroll', onResize);
        }

        // ========== 初始化 ==========
        function init() {
            window.addEventListener('beforeunload', forceSave);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') forceSave();
            });
            loadState();
            renderApp();
            generateReminders();
            bindKeyboardAdjust();
            setTimeout(() => {
                showWelcome();
            }, 500);
        }

        // 暴露全局函数
        window.showPage = showPage;
        window.navigateTo = navigateTo;
        window.toggleMenu = toggleMenu;
        window.closeMenu = closeMenu;
        window.closeMenuAndGoHome = closeMenuAndGoHome;
        window.openSettings = openSettings;
        window.randomTheme = randomTheme;
        window.switchRoom = switchRoom;
        window.openFurniture = openFurniture;
        window.openItemDetail = openItemDetail;
        window.backFromDetail = backFromDetail;
        window.deleteItem = deleteItem;
        window.openEntry = openEntry;
        window.editItem = editItem;
        window.saveItem = saveItem;
        window.addPhoto = addPhoto;
        window.removePhoto = removePhoto;
        window.renderPhotoUpload = renderPhotoUpload;
        window.onPhotoClick = onPhotoClick;
        window.setCover = setCover;
        window.photoDragStart = photoDragStart;
        window.photoDragOver = photoDragOver;
        window.photoDrop = photoDrop;
        window.toggleTagChip = toggleTagChip;
        window.updateFurnitureOptions = updateFurnitureOptions;
        window.setFilter = setFilter;
        window.setSubFilter = setSubFilter;
        window.filterItems = filterItems;
        window.markReminderRead = markReminderRead;
        window.deleteReminder = deleteReminder;
        window.readAllReminders = readAllReminders;
        window.deleteAllReminders = deleteAllReminders;
        window.openReminders = openReminders;
        window.addRoom = addRoom;
        window.editRoom = editRoom;
        window.deleteRoom = deleteRoom;
        window.addFurniture = addFurniture;
        window.deleteFurniture = deleteFurniture;
        window.addCategory = addCategory;
        window.deleteCategory = deleteCategory;
        window.editCategory = editCategory;
        window.addTag = addTag;
        window.deleteTag = deleteTag;
        window.addStatus = addStatus;
        window.deleteStatus = deleteStatus;
        window.selectTheme = selectTheme;
        window.downloadTemplate = downloadTemplate;
        window.saveFile = saveFile;
        window.exportExcel = exportExcel;
        window.importExcel = importExcel;
        window.toggleSetting = toggleSetting;
        window.toggleAllDisplayFields = toggleAllDisplayFields;
        window.openApiSettings = openApiSettings;
        window.saveApiSettings = saveApiSettings;
        window.sendChat = sendChat;
        window.useQuickPrompt = useQuickPrompt;
        window.chatUploadImages = chatUploadImages;
        window.chatTakePhoto = chatTakePhoto;
        window.removePendingImage = removePendingImage;
        window.focusSearch = focusSearch;
        window.onHomeSearch = onHomeSearch;
        window.doHomeSearch = doHomeSearch;
        window.applyTheme = applyTheme;
        window.clearChat = clearChat;
        window.addItemFromCard = addItemFromCard;
        window.changeAIModel = changeAIModel;
        window.state = state;
        window.bottomNavTo = bottomNavTo;
        window.openChatImageSource = openChatImageSource;
        window.hideChatSheet = hideChatSheet;
        window.onChatFiles = onChatFiles;
        window.autoResizeChatInput = autoResizeChatInput;
        window.updateChatSendBtn = updateChatSendBtn;

        // 启动
        init();
    </script>
</body>
</html>
